name: Benchmark & Performance Regression

run-name: "#${{ github.run_number }}: Benchmark ATPd (${{ github.ref_name }})"

on:
  push:
    branches:
      - main
      - dev
      - staging
      - ebpf
      - pure-ebpf
      - ebpf-native-api
      - 'ebpf/**'
      - 'feat-*'
      - 'feat/**'
      - 'test/**'
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'Makefile'
      - '.github/workflows/benchmark.yml'
  pull_request:
    branches: [main, dev, ebpf, pure-ebpf, ebpf-native-api]
  workflow_dispatch:

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: ATPd Performance Benchmark (Linux Runner)
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang llvm libbpf-dev iproute2 curl jq procps

      - name: Download & Install sing-box official package
        run: |
          DEB_URL="https://github.com/debiansid/sing-box/releases/download/v1.14.0-beta.8/sing-box_1.14.0-beta.8_linux_amd64.deb"
          curl -fSL -o /tmp/sing-box.deb "${DEB_URL}"
          sudo dpkg -i /tmp/sing-box.deb
          which sing-box
          sing-box version

      - name: Build Native ATPd
        run: |
          make clean && make

      - name: Run Benchmark Suite
        run: |
          chmod +x tests/benchmark_atpd.sh
          sudo -E ./tests/benchmark_atpd.sh ./build/bin/atpd /usr/bin/sing-box | tee bench_output.txt

      - name: Publish Performance Summary to GitHub UI
        if: always()
        run: |
          echo "## 🚀 ATPd Performance & Benchmark Summary" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat bench_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

name: Auto Clean GitHub Actions

on:
  schedule:
    # 每天 UTC 00:00 运行（北京时间 08:00）
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      days_to_keep:
        description: 'Keep runs from last N days'
        required: false
        default: '3'
        type: string

env:
  DAYS_TO_KEEP: 3

jobs:
  clean-caches:
    name: Clean Old Caches
    runs-on: ubuntu-latest
    steps:
      - name: Delete all caches older than 3 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Fetching all cache keys..."
          cache_keys=$(gh api repos/${{ github.repository }}/actions/caches \
            --jq '.actions_caches[].key' 2>/dev/null || echo "")
          
          if [ -z "$cache_keys" ]; then
            echo "No caches found."
            exit 0
          fi
          
          count=0
          for key in $cache_keys; do
            echo "Deleting cache: $key"
            gh api -X DELETE repos/${{ github.repository }}/actions/caches \
              -f key="$key" 2>/dev/null || true
            count=$((count + 1))
          done
          
          echo "Deleted $count caches."

  clean-old-runs:
    name: Delete Old Workflow Runs
    runs-on: ubuntu-latest
    steps:
      - name: Delete runs older than 3 days
        env:
          GH_TOKEN: ${{ github.token }}
          DAYS: ${{ github.event.inputs.days_to_keep || env.DAYS_TO_KEEP }}
        run: |
          DAYS=${DAYS:-3}
          CUTOFF_DATE=$(date -d "$DAYS days ago" --iso-8601=seconds 2>/dev/null || \
                        date -v-${DAYS}d +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || \
                        date +%Y-%m-%dT%H:%M:%SZ)
          
          echo "Keeping runs from last $DAYS days ($CUTOFF_DATE)"
          echo "CUTOFF_DATE=$CUTOFF_DATE" >> $GITHUB_ENV
          
          run_ids=$(gh api repos/${{ github.repository }}/actions/runs \
            --jq ".workflow_runs[] | select(.created_at < \"$CUTOFF_DATE\") | .id" 2>/dev/null || echo "")
          
          if [ -z "$run_ids" ]; then
            echo "No old workflow runs found."
            exit 0
          fi
          
          count=0
          for run_id in $run_ids; do
            echo "Deleting run: $run_id"
            gh api -X DELETE repos/${{ github.repository }}/actions/runs/$run_id 2>/dev/null || true
            count=$((count + 1))
          done
          
          echo "Deleted $count old workflow runs."
          echo "DELETED_COUNT=$count" >> $GITHUB_ENV

  clean-logs:
    name: Delete Old Workflow Logs
    runs-on: ubuntu-latest
    needs: [clean-old-runs]
    steps:
      - name: Delete logs of runs older than 3 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CUTOFF_DATE=${{ needs.clean-old-runs.env.CUTOFF_DATE }}
          if [ -z "$CUTOFF_DATE" ]; then
            CUTOFF_DATE=$(date -d "3 days ago" --iso-8601=seconds 2>/dev/null || \
                          date -v-3d +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || \
                          date +%Y-%m-%dT%H:%M:%SZ)
          fi
          
          run_ids=$(gh api repos/${{ github.repository }}/actions/runs \
            --jq ".workflow_runs[] | select(.created_at < \"$CUTOFF_DATE\") | .id" 2>/dev/null || echo "")
          
          if [ -z "$run_ids" ]; then
            echo "No old workflow runs found."
            exit 0
          fi
          
          count=0
          for run_id in $run_ids; do
            echo "Deleting logs for run: $run_id"
            gh api -X DELETE repos/${{ github.repository }}/actions/runs/$run_id/logs 2>/dev/null || true
            count=$((count + 1))
          done
          
          echo "Deleted logs for $count runs."

  clean-summary:
    name: Clean Summary
    runs-on: ubuntu-latest
    needs: [clean-caches, clean-old-runs, clean-logs]
    if: always()
    steps:
      - run: |
          echo "## Auto Cleanup Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Task | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Caches | ${{ needs.clean-caches.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Old Runs | ${{ needs.clean-old-runs.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Logs | ${{ needs.clean-logs.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Retention period: 3 days**" >> $GITHUB_STEP_SUMMARY
          echo "- Cleanup completed at $(date)" >> $GITHUB_STEP_SUMMARY

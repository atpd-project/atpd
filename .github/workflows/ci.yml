name: ATPD CI Pipeline

run-name: "#${{ github.run_number }}: ${{ github.workflow }} (${{ github.ref_name }})"

on:
  push:
    branches:
      - main
      - dev
      - staging
      - ebpf
      - pure-ebpf
      - ebpf-native-api
      - 'ebpf/**'
      - 'feat-*'
      - 'feat/**'
      - 'test/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - dev
      - ebpf
      - pure-ebpf
      - ebpf-native-api
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Stage 1 — Sanitizer Prerequisites (AMD64 Native Runner)
  # ASan, UBSan, TSan on ubuntu-24.04 with isolated ccache
  # ============================================================================
  sanitizer-amd64:
    name: "Sanitizer AMD64 / ${{ matrix.name }}"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: asan
            name: ASan
            flag: address
            libs: '-lpthread -l:libasan.so.8'
            runtime_package: libasan8
            options: abort_on_error=1:halt_on_error=1:detect_leaks=1
          - sanitizer: ubsan
            name: UBSan
            flag: undefined
            libs: '-lpthread -l:libubsan.so.1'
            runtime_package: libubsan1
            options: halt_on_error=1:print_stacktrace=1
          - sanitizer: tsan
            name: TSan
            flag: thread
            libs: '-lpthread'
            runtime_package: ''
            options: halt_on_error=1:second_deadlock_stack=1

    env:
      CCACHE_DIR: /home/runner/.cache/ccache
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: "2G"
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "1"
      CCACHE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Zig 0.16.0
        uses: ./.github/actions/setup-zig-0.16

      - name: Configure runner environment & dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo sysctl vm.mmap_rnd_bits=28 2>/dev/null || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq make curl jq procps ccache
          if [ -n "${{ matrix.runtime_package }}" ]; then
            sudo apt-get install -y -qq ${{ matrix.runtime_package }}
          fi

      - name: Restore isolated ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-amd64-zig0.16.0-${{ matrix.sanitizer }}-${{ hashFiles('Makefile', 'scripts/build.sh', 'scripts/gen_version.sh', '.zig-version') }}
          restore-keys: |
            ccache-${{ runner.os }}-amd64-zig0.16.0-${{ matrix.sanitizer }}-

      - name: Show toolchain & ccache initial statistics
        shell: bash
        run: |
          zig version
          ccache --version
          ccache -s

      - name: Verify active sanitizer runtime with standalone probe
        if: matrix.sanitizer == 'asan' || matrix.sanitizer == 'tsan'
        shell: bash
        run: |
          chmod +x tests/probe_sanitizer.sh
          ./tests/probe_sanitizer.sh ${{ matrix.sanitizer }}

      - name: Build and run test suite under ${{ matrix.name }}
        shell: bash
        env:
          ASAN_OPTIONS: ${{ matrix.sanitizer == 'asan' && matrix.options || '' }}
          UBSAN_OPTIONS: ${{ matrix.sanitizer == 'ubsan' && matrix.options || '' }}
          TSAN_OPTIONS: ${{ matrix.sanitizer == 'tsan' && matrix.options || '' }}
        run: |
          set -euo pipefail
          make clean
          make -j2 \
            CFLAGS="-Wall -Wextra -std=c11 -D_GNU_SOURCE -fPIC -g -O1 -fno-omit-frame-pointer -fsanitize=${{ matrix.flag }} -Iinclude -Ibuild/generated" \
            LIBS="${{ matrix.libs }}" \
            LDFLAGS="-Wl,-z,relro,-z,now" \
            test

      - name: Run sing-box integration under ASan
        if: matrix.sanitizer == 'asan'
        shell: bash
        env:
          ASAN_OPTIONS: abort_on_error=1:halt_on_error=1:detect_leaks=0
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/sing-box.deb "https://github.com/SagerNet/sing-box/releases/download/v1.14.0/sing-box_1.14.0_linux_amd64.deb"
          sudo dpkg -i /tmp/sing-box.deb
          sing-box version

          timeout 180s sudo -E bash tests/test_singbox_lifecycle.sh
          timeout 180s sudo -E bash tests/test_service_crash_recovery.sh build/bin/atpd /usr/bin/sing-box

      - name: Show ccache final statistics
        if: always()
        shell: bash
        run: |
          ccache -s

  # ============================================================================
  # Stage 1 — Sanitizer Prerequisites (ARM64 Native Runner)
  # ASan, UBSan, TSan on ubuntu-24.04-arm with isolated ccache
  # ============================================================================
  sanitizer-arm64:
    name: "Sanitizer ARM64 / ${{ matrix.name }}"
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: asan
            name: ASan
            flag: address
            libs: '-lpthread -l:libasan.so.8'
            runtime_package: libasan8
            options: abort_on_error=1:halt_on_error=1:detect_leaks=1
          - sanitizer: ubsan
            name: UBSan
            flag: undefined
            libs: '-lpthread -l:libubsan.so.1'
            runtime_package: libubsan1
            options: halt_on_error=1:print_stacktrace=1
          - sanitizer: tsan
            name: TSan
            flag: thread
            libs: '-lpthread'
            runtime_package: ''
            options: halt_on_error=1:second_deadlock_stack=1

    env:
      CCACHE_DIR: /home/runner/.cache/ccache
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: "2G"
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "1"
      CCACHE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Zig 0.16.0
        uses: ./.github/actions/setup-zig-0.16

      - name: Configure runner environment & dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo sysctl vm.mmap_rnd_bits=28 2>/dev/null || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq make curl jq procps ccache
          if [ -n "${{ matrix.runtime_package }}" ]; then
            sudo apt-get install -y -qq ${{ matrix.runtime_package }}
          fi

      - name: Restore isolated ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-arm64-zig0.16.0-${{ matrix.sanitizer }}-${{ hashFiles('Makefile', 'scripts/build.sh', 'scripts/gen_version.sh', '.zig-version') }}
          restore-keys: |
            ccache-${{ runner.os }}-arm64-zig0.16.0-${{ matrix.sanitizer }}-

      - name: Show toolchain & ccache initial statistics
        shell: bash
        run: |
          zig version
          ccache --version
          ccache -s

      - name: Verify active sanitizer runtime with standalone probe
        if: matrix.sanitizer == 'asan' || matrix.sanitizer == 'tsan'
        shell: bash
        run: |
          chmod +x tests/probe_sanitizer.sh
          ./tests/probe_sanitizer.sh ${{ matrix.sanitizer }}

      - name: Build and run test suite under ${{ matrix.name }}
        shell: bash
        env:
          ASAN_OPTIONS: ${{ matrix.sanitizer == 'asan' && matrix.options || '' }}
          UBSAN_OPTIONS: ${{ matrix.sanitizer == 'ubsan' && matrix.options || '' }}
          TSAN_OPTIONS: ${{ matrix.sanitizer == 'tsan' && matrix.options || '' }}
        run: |
          set -euo pipefail
          make clean
          make -j2 \
            CFLAGS="-Wall -Wextra -std=c11 -D_GNU_SOURCE -fPIC -g -O1 -fno-omit-frame-pointer -fsanitize=${{ matrix.flag }} -Iinclude -Ibuild/generated" \
            LIBS="${{ matrix.libs }}" \
            LDFLAGS="-Wl,-z,relro,-z,now" \
            test

      - name: Run sing-box integration under ASan
        if: matrix.sanitizer == 'asan'
        shell: bash
        env:
          ASAN_OPTIONS: abort_on_error=1:halt_on_error=1:detect_leaks=0
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/sing-box.deb "https://github.com/SagerNet/sing-box/releases/download/v1.14.0/sing-box_1.14.0_linux_arm64.deb"
          sudo dpkg -i /tmp/sing-box.deb
          sing-box version

          timeout 180s sudo -E bash tests/test_singbox_lifecycle.sh
          timeout 180s sudo -E bash tests/test_service_crash_recovery.sh build/bin/atpd /usr/bin/sing-box

      - name: Show ccache final statistics
        if: always()
        shell: bash
        run: |
          ccache -s

  # ============================================================================
  # Stage 2 — Release Build (AMD64 & ARM64)
  # Hard dependency: executes ONLY if BOTH sanitizer-amd64 and sanitizer-arm64 PASS.
  # ============================================================================
  release-build:
    name: "Release Build / ${{ matrix.name }}"
    needs: [sanitizer-amd64, sanitizer-arm64]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            name: AMD64
            runner: ubuntu-24.04
            file_arch: 'x86-64'
          - arch: arm64
            name: ARM64
            runner: ubuntu-24.04-arm
            file_arch: 'aarch64'

    outputs:
      atp_version: ${{ steps.version-meta.outputs.atp_version }}
      full_version: ${{ steps.version-meta.outputs.full_version }}

    env:
      CCACHE_DIR: /home/runner/.cache/ccache
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: "2G"
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "1"
      CCACHE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Zig 0.16.0
        uses: ./.github/actions/setup-zig-0.16

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq make ccache file

      - name: Restore isolated ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ matrix.arch }}-zig0.16.0-release-${{ hashFiles('Makefile', 'scripts/build.sh', 'scripts/gen_version.sh', '.zig-version') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.arch }}-zig0.16.0-release-

      - name: Show toolchain & ccache initial statistics
        shell: bash
        run: |
          zig version
          ccache --version
          ccache -s

      - name: Clean Native Build & Test
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make -j2
          make test

      - name: Verify Version Metadata & Clean Tree
        id: version-meta
        shell: bash
        run: |
          set -euo pipefail
          PROD_VER="$(cat VERSION)"
          FULL_VER="$(./build/bin/atpd -v | head -n 1)"
          echo "Product Version: ${PROD_VER}"
          echo "Full Runtime Version: ${FULL_VER}"

          if echo "${FULL_VER}" | grep -q "\.dirty"; then
            echo "ERROR: Clean CI release build produced .dirty version string!" >&2
            git status --porcelain >&2
            exit 1
          fi

          echo "atp_version=${PROD_VER}" >> "$GITHUB_OUTPUT"
          echo "full_version=${FULL_VER}" >> "$GITHUB_OUTPUT"

      - name: Verify Binary Architecture & Code Hygiene
        shell: bash
        run: |
          set -euo pipefail
          file ./build/bin/atpd
          ls -lh ./build/bin/atpd
          file ./build/bin/atpd | grep -i "${{ matrix.file_arch }}"
          git diff --check

      - name: Upload Native Release Binary
        uses: actions/upload-artifact@v4
        with:
          name: atpd-native-${{ matrix.arch }}
          path: ./build/bin/atpd
          retention-days: 7

      - name: Show ccache final statistics
        if: always()
        shell: bash
        run: |
          ccache -s

  # ============================================================================
  # Stage 3 — Integration & Final CI Gate
  # Runs lifecycle integration, configuration validation, resource benchmark,
  # architecture invariants, and syntax validation.
  # ============================================================================
  integration-gate:
    name: "Integration & Final CI Gate"
    needs: [release-build]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Zig 0.16.0
        uses: ./.github/actions/setup-zig-0.16

      - name: Install System Dependencies & sing-box
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq make libbpf-dev iproute2 curl jq procps
          curl -fsSL -o /tmp/sing-box.deb https://github.com/SagerNet/sing-box/releases/download/v1.14.0/sing-box_1.14.0_linux_amd64.deb
          sudo dpkg -i /tmp/sing-box.deb
          sing-box version

      - name: Build Native Release ATPd
        shell: bash
        run: |
          make clean
          make -j2

      - name: Run sing-box Lifecycle Integration Tests
        shell: bash
        run: |
          sudo -E bash tests/test_singbox_lifecycle.sh

      - name: Run Service Crash Recovery Tests
        shell: bash
        run: |
          sudo -E bash tests/test_service_crash_recovery.sh ./build/bin/atpd /usr/bin/sing-box

      - name: Run Configuration Validation Tests
        shell: bash
        run: |
          bash tests/test_config_validation.sh ./build/bin/atpd

      - name: Run Android Service Script Unit Tests
        shell: bash
        run: |
          bash tests/test_android_service.sh

      - name: Run Benchmark & Performance Regression
        shell: bash
        run: |
          sudo -E ./tests/benchmark_atpd.sh ./build/bin/atpd /usr/bin/sing-box | tee bench_output.txt

      - name: Architecture Invariant & Shell Syntax Checks
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking shell scripts syntax..."
          bash -n tests/*.sh scripts/*.sh

          echo "Checking architecture invariants..."
          # Invariant 1: No direct libc printf in library core modules
          ! grep -rn -w 'printf' src/reactor.c src/netlink.c src/service.c 2>/dev/null || {
            echo "ERROR: Direct printf forbidden in core daemon reactor/netlink/service" >&2
            exit 1
          }

          # Invariant 2: Version header is not tracked in git
          ! git ls-files --error-unmatch build/generated/version_build.h 2>/dev/null || {
            echo "ERROR: Generated version_build.h must not be tracked in git" >&2
            exit 1
          }

          echo "All architecture invariants verified."

      - name: Publish Performance Summary
        if: always()
        shell: bash
        run: |
          if [ -f bench_output.txt ]; then
            echo "## 🚀 ATPd Performance & Benchmark Summary" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat bench_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================================================
  # Stage 4 — Final CI Verdict
  # Reports final pass status across all gates.
  # ============================================================================
  final-ci-verdict:
    name: "Final CI Verdict"
    needs: [sanitizer-amd64, sanitizer-arm64, release-build, integration-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Output Release Gate Summary
        shell: bash
        run: |
          echo "================================================================================"
          echo "                    ATPD CI PIPELINE: ALL GATES PASSED"
          echo "================================================================================"
          echo "  [PASS] Stage 1: Sanitizer Prerequisites"
          echo "         - Sanitizer AMD64: ASan (PASS), UBSan (PASS), TSan (PASS)"
          echo "         - Sanitizer ARM64: ASan (PASS), UBSan (PASS), TSan (PASS)"
          echo "  [PASS] Stage 2: Native Release Build"
          echo "         - Release Build AMD64: PASS"
          echo "         - Release Build ARM64: PASS (zero Docker/QEMU)"
          echo "  [PASS] Stage 3: Integration & Invariants"
          echo "         - sing-box start/stop lifecycle (PASS)"
          echo "         - Process crash recovery & supervisor restart (PASS)"
          echo "         - Configuration validation (PASS)"
          echo "         - Benchmark & performance regression (PASS)"
          echo "         - Architecture invariant & shell syntax checks (PASS)"
          echo "================================================================================"

name: ATPD CI Pipeline

run-name: "#${{ github.run_number }}: ${{ github.workflow }} (${{ github.ref_name }})"

on:
  push:
    branches:
      - dev
      - 'feat/**'
      - 'fix/**'
      - 'test/**'
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Repository Hygiene & Architecture Invariant Checks (Architecture Independent)
  # ============================================================================
  repository-checks:
    name: "Repository Checks"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate Shell Script Syntax
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking shell scripts syntax..."
          bash -n tests/*.sh scripts/*.sh

      - name: Verify Architecture Invariants
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking architecture invariants..."
          # Invariant 1: No direct libc printf in library core modules
          ! grep -rn -w 'printf' src/reactor.c src/netlink.c src/service.c 2>/dev/null || {
            echo "ERROR: Direct printf forbidden in core daemon reactor/netlink/service" >&2
            exit 1
          }

          # Invariant 2: Version header is not tracked in git
          ! git ls-files --error-unmatch build/generated/version_build.h 2>/dev/null || {
            echo "ERROR: Generated version_build.h must not be tracked in git" >&2
            exit 1
          }

          echo "All architecture invariants verified."

      - name: Check Code Hygiene & Whitespace
        shell: bash
        run: |
          set -euo pipefail
          git diff --check

  # ============================================================================
  # ARM64 lane (production target: Google Pixel / Android bionic)
  # Sanitizer ARM64 -> Release ARM64 (zig, integration test binary) -> Integration ARM64
  #                 -> Release ARM64 (Android bionic, shipped binary)
  # ============================================================================
  sanitizer-arm64:
    name: "Sanitizer ARM64 / ${{ matrix.name }}"
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: asan
            name: ASan
            flag: address
            libs: '-lpthread -l:libasan.so.8'
            runtime_package: libasan8
            options: abort_on_error=1:halt_on_error=1:detect_leaks=1
          - sanitizer: ubsan
            name: UBSan
            flag: undefined
            libs: '-lpthread -l:libubsan.so.1'
            runtime_package: libubsan1
            options: halt_on_error=1:print_stacktrace=1
          - sanitizer: tsan
            name: TSan
            flag: thread
            libs: '-lpthread'
            runtime_package: ''
            options: halt_on_error=1:second_deadlock_stack=1

    env:
      CCACHE_DIR: /home/runner/.cache/ccache
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: "2G"
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "1"
      CCACHE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Zig 0.16.0
        uses: ./.github/actions/setup-zig-0.16

      - name: Configure runner environment & dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo sysctl vm.mmap_rnd_bits=28 2>/dev/null || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq make curl jq procps ccache
          if [ -n "${{ matrix.runtime_package }}" ]; then
            sudo apt-get install -y -qq ${{ matrix.runtime_package }}
          fi

      - name: Restore isolated ccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-arm64-zig0.16.0-${{ matrix.sanitizer }}-${{ hashFiles('Makefile', 'scripts/gen_version.sh', '.zig-version') }}
          restore-keys: |
            ccache-${{ runner.os }}-arm64-zig0.16.0-${{ matrix.sanitizer }}-

      - name: Show toolchain & ccache initial statistics
        shell: bash
        run: |
          zig version
          ccache --version
          ccache -s

      - name: Verify active sanitizer runtime with standalone probe
        if: matrix.sanitizer == 'asan' || matrix.sanitizer == 'tsan'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.sanitizer }}" = "tsan" ]; then
            sudo sysctl -w vm.mmap_rnd_bits=28
            test "$(sudo sysctl -n vm.mmap_rnd_bits)" = "28"
          fi
          chmod +x tests/probe_sanitizer.sh
          ./tests/probe_sanitizer.sh ${{ matrix.sanitizer }}

      - name: Build and run test suite under ${{ matrix.name }}
        shell: bash
        env:
          ASAN_OPTIONS: ${{ matrix.sanitizer == 'asan' && matrix.options || '' }}
          UBSAN_OPTIONS: ${{ matrix.sanitizer == 'ubsan' && matrix.options || '' }}
          TSAN_OPTIONS: ${{ matrix.sanitizer == 'tsan' && matrix.options || '' }}
        run: |
          set -euo pipefail
          make clean
          make -j2 \
            CFLAGS="-Wall -Wextra -std=c11 -D_GNU_SOURCE -fPIC -g -O1 -march=armv8-a -mtune=generic -fno-omit-frame-pointer -fsanitize=${{ matrix.flag }} -Iinclude -Ibuild/generated" \
            LIBS="${{ matrix.libs }}" \
            LDFLAGS="-Wl,-z,relro,-z,now" \
            test

      - name: Run sing-box integration under ASan
        if: matrix.sanitizer == 'asan'
        shell: bash
        env:
          ASAN_OPTIONS: abort_on_error=1:halt_on_error=1:detect_leaks=0
        run: |
          set -euo pipefail
          mkdir -p /tmp/sb-arm
          if ! curl -fsSL -o /tmp/sb-arm/sing-box.tar.gz "https://github.com/reF1nd/sing-box-releases/releases/download/v1.14.0-reF1nd.1/sing-box-1.14.0-reF1nd.1-linux-arm64-glibc.tar.gz"; then
            curl -fsSL -o /tmp/sb-arm/sing-box.tar.gz "https://github.com/reF1nd/sing-box-releases/releases/download/v1.14.0-reF1nd.1/sing-box-1.14.0-reF1nd.1-android-arm64.tar.gz"
          fi
          tar -xzf /tmp/sb-arm/sing-box.tar.gz -C /tmp/sb-arm/
          sudo cp "$(find /tmp/sb-arm -type f -name sing-box)" /usr/bin/sing-box
          sudo chmod +x /usr/bin/sing-box
          sing-box version
          sing-box tools ebpf status --help

          timeout 180s sudo -E bash tests/test_singbox_lifecycle.sh
          timeout 180s sudo -E bash tests/test_service_crash_recovery.sh build/bin/atpd /usr/bin/sing-box

      - name: Show ccache final statistics
        if: always()
        shell: bash
        run: |
          ccache -s

  release-arm64:
    name: "Release ARM64"
    needs: [sanitizer-arm64]
    runs-on: ubuntu-24.04-arm

    outputs:
      atp_version: ${{ steps.version-meta.outputs.atp_version }}
      full_version: ${{ steps.version-meta.outputs.full_version }}
      zig_binary_size: ${{ steps.version-meta.outputs.zig_binary_size }}
      zig_compiler_ver: ${{ steps.version-meta.outputs.zig_compiler_ver }}

    env:
      CCACHE_DIR: /home/runner/.cache/ccache
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: "2G"
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "1"
      CCACHE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Zig 0.16.0
        uses: ./.github/actions/setup-zig-0.16

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq make ccache file

      - name: Restore isolated ccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-arm64-zig0.16.0-release-${{ hashFiles('Makefile', 'scripts/gen_version.sh', '.zig-version') }}
          restore-keys: |
            ccache-${{ runner.os }}-arm64-zig0.16.0-release-

      - name: Show toolchain & ccache initial statistics
        shell: bash
        run: |
          zig version
          ccache --version
          ccache -s

      - name: Generate Version
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/gen_version.sh

      - name: Build Native Release Binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/bin
          zig cc -target aarch64-linux \
            -s -Oz -flto -ffunction-sections -fdata-sections -static \
            -fno-unwind-tables -fno-asynchronous-unwind-tables \
            -fmerge-all-constants -fno-ident \
            -Iinclude \
            -Ibuild/generated \
            -D_GNU_SOURCE \
            -DNDEBUG \
            -DYYJSON_DISABLE_WRITER=1 \
            -DYYJSON_DISABLE_FAST_FP_CONV=1 \
            -DYYJSON_DISABLE_NON_STANDARD=1 \
            -DLOG_LOCATION_ENABLED=0 \
            -DATP_DEFAULT_DIR=\"/data/adb/atp\" \
            -DATP_CONF_FILE=\"atp.conf\" \
            -DATP_PID_FILE=\"run/atpd.pid\" \
            -DATP_LOG_FILE=\"run/atp.log\" \
            -DATP_COMMAND_SOCKET=\"run/atpd.sock\" \
            -o build/bin/atpd \
            $(find src -name "*.c") \
            -Wl,--gc-sections -Wl,--strip-all -Wl,--build-id=none

      - name: Verify Version Metadata & Clean Tree
        id: version-meta
        shell: bash
        run: |
          set -euo pipefail
          PROD_VER="$(cat VERSION)"
          FULL_VER="$(./build/bin/atpd -v | head -n 1)"
          echo "Product Version: ${PROD_VER}"
          echo "Full Runtime Version: ${FULL_VER}"

          if echo "${FULL_VER}" | grep -q "\.dirty"; then
            echo "ERROR: Clean CI release build produced .dirty version string!" >&2
            git status --porcelain >&2
            exit 1
          fi

          echo "atp_version=${PROD_VER}" >> "$GITHUB_OUTPUT"
          echo "full_version=${FULL_VER}" >> "$GITHUB_OUTPUT"
          echo "zig_binary_size=$(du -h ./build/bin/atpd | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "zig_compiler_ver=$(zig version)" >> "$GITHUB_OUTPUT"

      - name: Verify Binary Architecture
        shell: bash
        run: |
          set -euo pipefail
          file ./build/bin/atpd
          ls -lh ./build/bin/atpd
          file ./build/bin/atpd | grep -i 'aarch64'
          file ./build/bin/atpd | grep -i 'statically linked'
          file ./build/bin/atpd | grep -i 'stripped'
          ! readelf -l ./build/bin/atpd | grep INTERP

      - name: Upload Native Release Binary
        uses: actions/upload-artifact@v7
        with:
          name: atpd-native-arm64
          path: ./build/bin/atpd
          retention-days: 7

      - name: Show ccache final statistics
        if: always()
        shell: bash
        run: |
          ccache -s

  release-arm64-bionic:
    name: "Release ARM64 (Android bionic)"
    needs: [sanitizer-arm64]
    runs-on: ubuntu-24.04

    outputs:
      bionic_binary_size: ${{ steps.bionic-meta.outputs.bionic_binary_size }}
      bionic_compiler_ver: ${{ steps.bionic-meta.outputs.bionic_compiler_ver }}

    env:
      NDK_VERSION: r30
      NDK_SHA1: 5107f898313790e449e87eee2183d9a20602dee9
      ANDROID_API: "24"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Restore Android NDK
        id: ndk-cache
        uses: actions/cache@v5
        with:
          path: ~/android-ndk-${{ env.NDK_VERSION }}
          key: android-ndk-${{ env.NDK_VERSION }}-${{ env.NDK_SHA1 }}

      - name: Install Android NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip" -o /tmp/ndk.zip
          echo "${NDK_SHA1}  /tmp/ndk.zip" | sha1sum -c -
          unzip -q /tmp/ndk.zip -d ~
          rm -f /tmp/ndk.zip

      - name: Generate Version
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/gen_version.sh

      - name: Build Bionic Release Binary
        id: bionic-meta
        shell: bash
        run: |
          set -euo pipefail
          CC="${HOME}/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang"
          "$CC" --version | head -n 1
          mkdir -p build/bin
          "$CC" \
            -s -Oz -flto -ffunction-sections -fdata-sections \
            -fno-unwind-tables -fno-asynchronous-unwind-tables \
            -fmerge-all-constants -fno-ident \
            -Iinclude \
            -Ibuild/generated \
            -D_GNU_SOURCE \
            -DNDEBUG \
            -DYYJSON_DISABLE_WRITER=1 \
            -DYYJSON_DISABLE_FAST_FP_CONV=1 \
            -DYYJSON_DISABLE_NON_STANDARD=1 \
            -DLOG_LOCATION_ENABLED=0 \
            -DATP_DEFAULT_DIR=\"/data/adb/atp\" \
            -DATP_CONF_FILE=\"atp.conf\" \
            -DATP_PID_FILE=\"run/atpd.pid\" \
            -DATP_LOG_FILE=\"run/atp.log\" \
            -DATP_COMMAND_SOCKET=\"run/atpd.sock\" \
            -o build/bin/atpd \
            $(find src -name "*.c") \
            -Wl,--gc-sections -Wl,--strip-all -Wl,--build-id=none
          echo "bionic_binary_size=$(du -h ./build/bin/atpd | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "bionic_compiler_ver=NDK ${NDK_VERSION} $("$CC" --version | grep -o 'clang version [0-9.]*') API ${ANDROID_API}" >> "$GITHUB_OUTPUT"

      # Cannot execute on the Linux runner; verify it targets Android's loader instead.
      - name: Verify Binary Architecture
        shell: bash
        run: |
          set -euo pipefail
          file ./build/bin/atpd
          ls -lh ./build/bin/atpd
          file ./build/bin/atpd | grep -i 'aarch64'
          file ./build/bin/atpd | grep -i 'stripped'
          readelf -l ./build/bin/atpd | grep -F '/system/bin/linker64'
          readelf -n ./build/bin/atpd | grep -F 'Android'

      - name: Upload Bionic Release Binary
        uses: actions/upload-artifact@v7
        with:
          name: atpd-bionic-arm64
          path: ./build/bin/atpd
          retention-days: 7

  integration-arm64:
    name: "Integration ARM64"
    needs: [release-arm64]
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Zig 0.16.0
        uses: ./.github/actions/setup-zig-0.16

      - name: Install System Dependencies & sing-box
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq make libbpf-dev iproute2 curl jq procps
          mkdir -p /tmp/sb-arm
          if ! curl -fsSL -o /tmp/sb-arm/sing-box.tar.gz "https://github.com/reF1nd/sing-box-releases/releases/download/v1.14.0-reF1nd.1/sing-box-1.14.0-reF1nd.1-linux-arm64-glibc.tar.gz"; then
            curl -fsSL -o /tmp/sb-arm/sing-box.tar.gz "https://github.com/reF1nd/sing-box-releases/releases/download/v1.14.0-reF1nd.1/sing-box-1.14.0-reF1nd.1-android-arm64.tar.gz"
          fi
          tar -xzf /tmp/sb-arm/sing-box.tar.gz -C /tmp/sb-arm/
          sudo cp "$(find /tmp/sb-arm -type f -name sing-box)" /usr/bin/sing-box
          sudo chmod +x /usr/bin/sing-box
          sing-box version
          sing-box tools ebpf status --help

      - name: Download Native Release Binary
        uses: actions/download-artifact@v8
        with:
          name: atpd-native-arm64
          path: build/bin

      - name: Make Binary Executable & Verify Architecture
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./build/bin/atpd
          file ./build/bin/atpd | grep -i 'aarch64'
          ./build/bin/atpd -v

      - name: Run sing-box Lifecycle Integration Tests
        shell: bash
        run: |
          sudo -E bash tests/test_singbox_lifecycle.sh

      - name: Run Service Crash Recovery Tests
        shell: bash
        run: |
          sudo -E bash tests/test_service_crash_recovery.sh ./build/bin/atpd /usr/bin/sing-box

      - name: Run Configuration Validation Tests
        shell: bash
        run: |
          bash tests/test_config_validation.sh ./build/bin/atpd

      - name: Run Android Service Script Unit Tests
        shell: bash
        run: |
          bash tests/test_android_service.sh

      - name: Run Benchmark & Performance Regression
        shell: bash
        run: |
          sudo -E ./tests/benchmark_atpd.sh ./build/bin/atpd /usr/bin/sing-box | tee bench_output.txt

      - name: Publish Performance Summary
        if: always()
        shell: bash
        run: |
          if [ -f bench_output.txt ]; then
            echo "## 🚀 ATPd ARM64 Performance & Benchmark Summary" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat bench_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================================================
  # Final CI Verdict
  # Reports final pass status across the ARM64 lane and Repository Checks.
  # ============================================================================
  final-ci-verdict:
    name: "Final CI Verdict"
    needs: [integration-arm64, release-arm64-bionic, repository-checks]
    runs-on: ubuntu-latest
    steps:
      - name: Output Release Gate Summary
        shell: bash
        run: |
          echo "================================================================================"
          echo "                    ATPD CI PIPELINE: ALL GATES PASSED"
          echo "================================================================================"
          echo "  [PASS] Repository Checks:"
          echo "         - Shell syntax & code hygiene"
          echo "         - Architecture invariants (no direct printf in core, untracked headers)"
          echo "  [PASS] ARM64:"
          echo "         - Sanitizer ARM64: ASan, UBSan, TSan"
          echo "         - Release ARM64: Native Clean Build & Packaging"
          echo "         - Release ARM64 (Android bionic): NDK Build"
          echo "         - Integration ARM64: Lifecycle, Crash Recovery, Config, Benchmark"
          echo "================================================================================"

  # ============================================================================
  # Report CI Build Results
  # ============================================================================
  update-status:
    name: "Report Build Results"
    needs: [final-ci-verdict, release-arm64, release-arm64-bionic]
    runs-on: ubuntu-latest
    if: github.repository == 'atpd-project/atpd'
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract commit title
        id: commit
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ -n "$PR_TITLE" ]]; then
            TITLE=$(printf '%s\n' "$PR_TITLE" | head -n1)
          else
            TITLE=$(printf '%s\n' "$HEAD_MESSAGE" | head -n1)
          fi
          printf 'title=%s\n' "$TITLE" >> "$GITHUB_OUTPUT"

      - name: Report Build Results
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
          ZIG_SIZE: ${{ needs.release-arm64.outputs.zig_binary_size }}
          ATP_VERSION: ${{ needs.release-arm64.outputs.atp_version || 'N/A' }}
          ZIG_COMPILER_VER: ${{ needs.release-arm64.outputs.zig_compiler_ver || 'N/A' }}
          BIONIC_SIZE: ${{ needs.release-arm64-bionic.outputs.bionic_binary_size }}
          BIONIC_COMPILER_VER: ${{ needs.release-arm64-bionic.outputs.bionic_compiler_ver || 'N/A' }}
          ATPD_VERSION_STRING: ${{ needs.release-arm64.outputs.full_version || 'N/A' }}
          COMMIT_TITLE: ${{ steps.commit.outputs.title }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          .github/scripts/notify.sh all

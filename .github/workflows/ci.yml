name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "Test (arm64 host)"
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Parity gate: run the C repo's root-level harnesses against the Rust binary
  # (mirrors atpd's "Integration ARM64" job).
  integration:
    name: "Integration ARM64 (atpd harnesses)"
    needs: [test]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Checkout atpd harnesses
        uses: actions/checkout@v7
        with:
          repository: atpd-project/atpd
          ref: dev
          path: atpd

      - name: Install System Dependencies & sing-box
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq make libbpf-dev iproute2 curl jq procps
          mkdir -p /tmp/sb-arm
          if ! curl -fsSL -o /tmp/sb-arm/sing-box.tar.gz "https://github.com/reF1nd/sing-box-releases/releases/download/v1.14.0-reF1nd.1/sing-box-1.14.0-reF1nd.1-linux-arm64-glibc.tar.gz"; then
            curl -fsSL -o /tmp/sb-arm/sing-box.tar.gz "https://github.com/reF1nd/sing-box-releases/releases/download/v1.14.0-reF1nd.1/sing-box-1.14.0-reF1nd.1-android-arm64.tar.gz"
          fi
          tar -xzf /tmp/sb-arm/sing-box.tar.gz -C /tmp/sb-arm/
          sudo cp "$(find /tmp/sb-arm -type f -name sing-box)" /usr/bin/sing-box
          sudo chmod +x /usr/bin/sing-box
          sing-box version
          sing-box tools ebpf status --help

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      # test_singbox_lifecycle.sh only looks at build/bin/atpd.
      - name: Build Rust Release Binary
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release
          mkdir -p atpd/build/bin
          cp target/release/atpd atpd/build/bin/atpd
          file atpd/build/bin/atpd | grep -i 'aarch64'
          atpd/build/bin/atpd -v

      - name: Run sing-box Lifecycle Integration Tests
        working-directory: atpd
        run: sudo -E bash tests/test_singbox_lifecycle.sh

      - name: Run Service Crash Recovery Tests
        working-directory: atpd
        run: sudo -E bash tests/test_service_crash_recovery.sh ./build/bin/atpd /usr/bin/sing-box

      - name: Run Configuration Validation Tests
        working-directory: atpd
        run: bash tests/test_config_validation.sh ./build/bin/atpd

      - name: Run Benchmark & Performance Regression
        working-directory: atpd
        shell: bash
        run: |
          sudo -E ./tests/benchmark_atpd.sh ./build/bin/atpd /usr/bin/sing-box | tee bench_output.txt

      - name: Publish Performance Summary
        if: always()
        working-directory: atpd
        shell: bash
        run: |
          if [ -f bench_output.txt ]; then
            echo "## ATPD Rust ARM64 Benchmark Summary" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat bench_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  android:
    name: "Release ARM64 (Android bionic)"
    needs: [test]
    # The NDK only ships linux-x86_64 host binaries.
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: r30
      NDK_SHA1: 5107f898313790e449e87eee2183d9a20602dee9
      ANDROID_API: "24"
    steps:
      - uses: actions/checkout@v7

      - name: Restore Android NDK
        id: ndk-cache
        uses: actions/cache@v5
        with:
          path: ~/android-ndk-${{ env.NDK_VERSION }}
          key: android-ndk-${{ env.NDK_VERSION }}-${{ env.NDK_SHA1 }}

      - name: Install Android NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip" -o /tmp/ndk.zip
          echo "${NDK_SHA1}  /tmp/ndk.zip" | sha1sum -c -
          unzip -q /tmp/ndk.zip -d ~
          rm -f /tmp/ndk.zip

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target aarch64-linux-android && rustup default stable

      - name: Build
        run: |
          set -euo pipefail
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="${HOME}/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang"
          cargo build --release --target aarch64-linux-android

      # Cannot execute on the Linux runner; verify it targets Android's loader instead.
      - name: Verify Binary
        run: |
          set -euo pipefail
          bin=target/aarch64-linux-android/release/atpd
          file "$bin"
          ls -lh "$bin"
          file "$bin" | grep -i 'aarch64'
          file "$bin" | grep -i 'stripped'
          readelf -l "$bin" | grep -F '/system/bin/linker64'
          readelf -n "$bin" | grep -F 'Android'
          # Android 15+ needs every LOAD segment aligned to 16 KB.
          for align in $(readelf -lW "$bin" | awk '$1=="LOAD" {print $NF}'); do
            (( align >= 16384 )) || { echo "LOAD segment alignment $align < 16 KB"; exit 1; }
          done

      # Ship the device smoke test with the binary; a zip keeps its LF line endings intact.
      - name: Stage artifact
        run: |
          mkdir -p dist
          cp target/aarch64-linux-android/release/atpd scripts/pixel-smoke.sh dist/

      - uses: actions/upload-artifact@v7
        with:
          name: atpd-bionic-arm64
          path: dist/
          retention-days: 7

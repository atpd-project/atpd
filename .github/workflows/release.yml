name: ATPD Rust Release Pipeline

run-name: "Release ${{ github.event.inputs.tag_name || github.ref_name }}"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to release (leave empty to use current ref)'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # ============================================================================
  # Build Android Bionic ARM64 Release Binary (the only shipped artifact)
  # ============================================================================
  build-release-bionic:
    name: "Build Release ARM64 (Android bionic)"
    # The NDK only ships linux-x86_64 host binaries.
    runs-on: ubuntu-24.04
    outputs:
      atp_version: ${{ steps.bionic-meta.outputs.atp_version }}
      bionic_binary_size: ${{ steps.bionic-meta.outputs.bionic_binary_size }}
      bionic_compiler_ver: ${{ steps.bionic-meta.outputs.bionic_compiler_ver }}
    env:
      NDK_VERSION: r30
      NDK_SHA1: 5107f898313790e449e87eee2183d9a20602dee9
      ANDROID_API: "24"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}
          fetch-depth: 0

      - name: Restore Android NDK
        id: ndk-cache
        uses: actions/cache@v5
        with:
          path: ~/android-ndk-${{ env.NDK_VERSION }}
          key: android-ndk-${{ env.NDK_VERSION }}-${{ env.NDK_SHA1 }}

      - name: Install Android NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip" -o /tmp/ndk.zip
          echo "${NDK_SHA1}  /tmp/ndk.zip" | sha1sum -c -
          unzip -q /tmp/ndk.zip -d ~
          rm -f /tmp/ndk.zip

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target aarch64-linux-android && rustup default stable

      - name: Build Bionic Release
        id: bionic-meta
        run: |
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="${HOME}/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang"
          cargo build --release --locked --target aarch64-linux-android
          mkdir -p dist-bionic
          cp target/aarch64-linux-android/release/atpd dist-bionic/atpd
          echo "atp_version=$(cat VERSION 2>/dev/null || sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)" >> "$GITHUB_OUTPUT"
          echo "bionic_binary_size=$(du -h dist-bionic/atpd | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "bionic_compiler_ver=$(rustc --version | cut -d' ' -f1-2) + NDK ${NDK_VERSION} API ${ANDROID_API}" >> "$GITHUB_OUTPUT"

      - name: Verify Bionic Binary Architecture
        run: |
          bin=dist-bionic/atpd
          file "$bin"
          ls -lh "$bin"
          file "$bin" | grep -i 'aarch64'
          file "$bin" | grep -i 'stripped'
          readelf -l "$bin" | grep -F '/system/bin/linker64'
          readelf -n "$bin" | grep -F 'Android'
          for align in $(readelf -lW "$bin" | awk '$1=="LOAD" {print $NF}'); do
            (( align >= 16384 )) || { echo "LOAD segment alignment $align < 16 KB"; exit 1; }
          done

      - name: Upload Bionic Release Binary
        uses: actions/upload-artifact@v7
        with:
          name: atpd-bionic-arm64
          path: dist-bionic/atpd
          retention-days: 7

  # ============================================================================
  # Publish GitHub Release & Update Dashboard / Telegram Notification
  # ============================================================================
  publish-release:
    name: "Publish GitHub Release & Notify"
    needs: [build-release-bionic]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}
          fetch-depth: 0

      - name: Download Bionic Binary
        uses: actions/download-artifact@v8
        with:
          name: atpd-bionic-arm64
          path: build-bionic

      - name: Package Release Assets
        id: pkg
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          mkdir -p dist pkg-android
          install -m 755 build-bionic/atpd pkg-android/atpd
          cp README.md pkg-android/
          tar -czvf "dist/atpd-${TAG}-android-arm64.tar.gz" -C pkg-android .
          (cd dist && sha256sum atpd-*.tar.gz > sha256sums.txt && cat sha256sums.txt)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.pkg.outputs.tag }}"
          # Recreate the release if the tag is re-run.
          gh release delete "$TAG" -y 2>/dev/null || true
          gh release create "$TAG" \
            --title "${TAG#v}" \
            --generate-notes \
            dist/atpd-*.tar.gz \
            dist/sha256sums.txt

      - name: Update Dashboard Issue & Telegram Broadcast
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.pkg.outputs.tag }}
          ATP_VERSION: ${{ needs.build-release-bionic.outputs.atp_version || steps.pkg.outputs.tag }}
          BIONIC_SIZE: ${{ needs.build-release-bionic.outputs.bionic_binary_size }}
          BIONIC_COMPILER_VER: ${{ needs.build-release-bionic.outputs.bionic_compiler_ver || 'N/A' }}
          ATPD_VERSION_STRING: atpd ${{ needs.build-release-bionic.outputs.atp_version }}
          COMMIT_TITLE: "Release ${{ steps.pkg.outputs.tag }}"
          COMMIT_MSG: "Production release ${{ steps.pkg.outputs.tag }}"
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: .github/scripts/notify.sh all

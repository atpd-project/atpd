name: Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-clang:
    runs-on: ubuntu-latest
    outputs:
      binary_size: ${{ steps.clang-build.outputs.binary_size }}
      atp_version: ${{ steps.clang-build.outputs.atp_version }}
    steps:
      - uses: actions/checkout@v6

      - name: Get Short SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build with Clang
        id: clang-build
        uses: ./.github/actions/build-clang
        with:
          artifact-suffix: '-release-${{ steps.vars.outputs.short_sha }}'

  build-zig:
    runs-on: ubuntu-latest
    outputs:
      zig_binary_size: ${{ steps.zig-build.outputs.zig_binary_size }}
      atpd_version_string: ${{ steps.zig-build.outputs.atpd_version_string }}
    steps:
      - uses: actions/checkout@v6

      - name: Get Short SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build with Zig
        id: zig-build
        uses: ./.github/actions/build-zig
        with:
          artifact-suffix: '-release-${{ steps.vars.outputs.short_sha }}'

  create-release:
    name: Create GitHub Release
    needs: [build-clang, build-zig]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get Short SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Download Clang Artifact
        uses: actions/download-artifact@v5
        with:
          name: atpd-clang-release-${{ steps.vars.outputs.short_sha }}

      - name: Download Zig Artifact
        uses: actions/download-artifact@v5
        with:
          name: atpd-zig-release-${{ steps.vars.outputs.short_sha }}

      - name: Generate Changelog
        run: |
          PREV_TAG=$(git tag -l "v*" --sort=-v:refname | grep -v "${{ github.ref_name }}" | head -1)
          
          if [ -n "$PREV_TAG" ]; then
            echo "## Changes since ${PREV_TAG}" > /tmp/changelog.md
            echo "" >> /tmp/changelog.md
            git log ${PREV_TAG}..${{ github.ref_name }} --oneline --no-merges --grep="empty:" --invert-grep | while read line; do
              echo "- ${line}" >> /tmp/changelog.md
            done
          else
            echo "## Initial Release" > /tmp/changelog.md
            echo "" >> /tmp/changelog.md
            git log --oneline --no-merges --grep="empty:" --invert-grep | while read line; do
              echo "- ${line}" >> /tmp/changelog.md
            done
          fi
          
          echo "" >> /tmp/changelog.md
          echo "### 📦 Builds" >> /tmp/changelog.md
          echo "" >> /tmp/changelog.md
          echo "| Toolchain | Size |" >> /tmp/changelog.md
          echo "|-----------|------|" >> /tmp/changelog.md
          echo "| Clang 21 (Musl) | ${{ needs.build-clang.outputs.binary_size }} |" >> /tmp/changelog.md
          echo "| Zig CC (Musl) | ${{ needs.build-zig.outputs.zig_binary_size }} |" >> /tmp/changelog.md
          echo "" >> /tmp/changelog.md
          echo "### 🔧 Usage" >> /tmp/changelog.md
          echo '```bash' >> /tmp/changelog.md
          echo "adb push atpd-clang /data/local/tmp/atpd" >> /tmp/changelog.md
          echo "adb shell chmod +x /data/local/tmp/atpd" >> /tmp/changelog.md
          echo '```' >> /tmp/changelog.md
          
          cat /tmp/changelog.md

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          ATP_VERSION: ${{ needs.build-clang.outputs.atp_version }}
        run: |
          IS_PRERELEASE=""
          if [[ "${{ github.ref_name }}" == *-beta* ]] || [[ "${{ github.ref_name }}" == *-alpha* ]] || [[ "${{ github.ref_name }}" == *-rc* ]]; then
            IS_PRERELEASE="--prerelease"
          fi
          
          gh release create ${{ github.ref_name }} \
            atpd-clang-release-* atpd-zig-release-* \
            --title "ATPd ${ATP_VERSION}" \
            --notes-file /tmp/changelog.md \
            $IS_PRERELEASE

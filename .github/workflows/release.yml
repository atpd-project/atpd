name: Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-clang:
    runs-on: ubuntu-latest
    outputs:
      binary_size: ${{ steps.clang-build.outputs.binary_size }}
      atp_version: ${{ steps.clang-build.outputs.atp_version }}
    steps:
      - name: Build with Clang
        id: clang-build
        uses: ./.github/actions/build-clang
        with:
          artifact-suffix: ''

  build-zig:
    runs-on: ubuntu-latest
    outputs:
      zig_binary_size: ${{ steps.zig-build.outputs.zig_binary_size }}
    steps:
      - name: Build with Zig
        id: zig-build
        uses: ./.github/actions/build-zig
        with:
          artifact-suffix: ''

  create-release:
    name: Create GitHub Release
    needs: [build-clang, build-zig]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Clang Artifact
        uses: actions/download-artifact@v5
        with:
          name: atpd-clang

      - name: Download Zig Artifact
        uses: actions/download-artifact@v5
        with:
          name: atpd-zig

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          CLANG_SIZE: ${{ needs.build-clang.outputs.binary_size }}
          ZIG_SIZE: ${{ needs.build-zig.outputs.zig_binary_size }}
          ATP_VERSION: ${{ needs.build-clang.outputs.atp_version }}
        run: |
          IS_PRERELEASE=""
          if [[ "${{ github.ref_name }}" == *-beta* ]] || [[ "${{ github.ref_name }}" == *-alpha* ]] || [[ "${{ github.ref_name }}" == *-rc* ]]; then
            IS_PRERELEASE="--prerelease"
          fi
          
          gh release create ${{ github.ref_name }} \
            atpd-clang atpd-zig \
            --title "ATPd ${ATP_VERSION}" \
            --notes "## ATPd ${ATP_VERSION}

          ### 📦 Builds
          | Toolchain | Size |
          |-----------|------|
          | Clang 19 | ${CLANG_SIZE} |
          | Zig CC | ${ZIG_SIZE} |

          ### 🔧 Usage
          \`\`\`bash
          adb push atpd-clang /data/local/tmp/atpd
          adb shell chmod +x /data/local/tmp/atpd
          \`\`\`" \
            $IS_PRERELEASE

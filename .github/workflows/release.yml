name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-clang:
    runs-on: ubuntu-latest
    outputs:
      binary_size: ${{ steps.extract.outputs.binary_size }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker Image
        run: |
          docker buildx build --platform linux/arm64 \
            --build-arg BUILD_FLAGS="-Os -flto -fstack-protector-strong -D_FORTIFY_SOURCE=3 -ffunction-sections -fdata-sections" \
            --target builder -t atp-builder --load .
          container_id=$(docker create --platform linux/arm64 atp-builder)
          docker cp $container_id:/app/build/bin/atpd ./atpd-clang
          docker rm -v $container_id

      - name: Extract Metadata
        id: extract
        run: |
          SIZE=$(du -h ./atpd-clang | cut -f1)
          echo "binary_size=$SIZE" >> $GITHUB_OUTPUT

      - name: Upload Clang Artifact
        uses: actions/upload-artifact@v5
        with:
          name: atpd-clang
          path: ./atpd-clang
          retention-days: 7

  build-zig:
    runs-on: ubuntu-latest
    outputs:
      zig_binary_size: ${{ steps.zig-extract.outputs.zig_binary_size }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: master

      - name: Build with Zig CC
        run: |
          zig cc -target aarch64-linux \
            -s -Oz -flto -ffunction-sections -fdata-sections -static \
            -Iinclude -D_GNU_SOURCE \
            -DATP_DEFAULT_DIR="/data/adb/atp" \
            -o atpd-zig \
            $(find src -name "*.c" ! -path "src/cjson/*" ! -path "src/yyjson/*" ! -name "epoll.c") \
            src/yyjson/yyjson.c \
            -Wl,--gc-sections -Wl,--strip-all

      - name: Extract Metadata
        id: zig-extract
        run: |
          ZIG_SIZE=$(du -h ./atpd-zig | cut -f1)
          echo "zig_binary_size=$ZIG_SIZE" >> $GITHUB_OUTPUT

      - name: Upload Zig Artifact
        uses: actions/upload-artifact@v5
        with:
          name: atpd-zig
          path: ./atpd-zig
          retention-days: 7

  create-release:
    name: Create GitHub Release
    needs: [build-clang, build-zig]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download Clang Artifact
        uses: actions/download-artifact@v5
        with:
          name: atpd-clang

      - name: Download Zig Artifact
        uses: actions/download-artifact@v5
        with:
          name: atpd-zig

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          CLANG_SIZE: ${{ needs.build-clang.outputs.binary_size }}
          ZIG_SIZE: ${{ needs.build-zig.outputs.zig_binary_size }}
        run: |
          gh release create ${{ github.ref_name }} \
            atpd-clang atpd-zig \
            --title "ATPd ${{ github.ref_name }}" \
            --notes "## ATPd ${{ github.ref_name }}

          ### 📦 Builds
          | Toolchain | Size |
          |-----------|------|
          | Clang 19 | ${CLANG_SIZE} |
          | Zig CC | ${ZIG_SIZE} |

          ### 🔧 Usage
          \`\`\`bash
          adb push atpd-clang /data/local/tmp/atpd
          adb shell chmod +x /data/local/tmp/atpd
          \`\`\`"

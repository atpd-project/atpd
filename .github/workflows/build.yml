name: Build ATP for Android (musl)
run-name: ATPD-${{ github.ref_name }} [${{ github.sha.short }}]

on:
  push:
    branches: [dev, main, test-ci-refine]
    tags: [ 'v*' ]
    paths: [ 'src/**', 'include/**', 'scripts/**', 'Makefile', '.github/**' ]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Compile-${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      full_ver: ${{ steps.vars.outputs.full_ver }}
      features: ${{ steps.build-atp.outputs.features }}
      binary_size: ${{ steps.size.outputs.atp_size }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Metadata
        id: vars
        shell: bash
        run: |
          SHA=$(git rev-parse --short HEAD)
          BRANCH=$(echo "${{ github.ref_name }}" | sed 's/feat-//' | tr '[:lower:]' '[:upper:]')
          echo "full_ver=${BRANCH}+${SHA}" >> $GITHUB_OUTPUT

      - name: Setup environment
        id: setup
        uses: ./.github/actions/setup-musl-env

      - name: Build
        id: build-atp
        uses: ./.github/actions/build-atp
        with:
          version: ${{ steps.vars.outputs.full_ver }}
          cc-path: ${{ steps.setup.outputs.cc-path }}
          strip-path: ${{ steps.setup.outputs.strip-path }}
          libev-include-path: ${{ steps.setup.outputs.libev-include-path }}
          libev-lib-path: ${{ steps.setup.outputs.libev-lib-path }}

      - name: Calculate Size
        id: size
        shell: bash
        run: |
          SIZE=$(du -h build/bin/atpd | cut -f1)
          echo "atp_size=${SIZE}" >> $GITHUB_OUTPUT

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: atpd-${{ steps.vars.outputs.full_ver }}
          path: build/bin/atpd
          retention-days: 7

  update-checkpoint:
    name: Update Checkpoint
    needs: build
    if: success()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Update Issue
        uses: actions/github-script@v7
        env:
          FULL_VER: ${{ needs.build.outputs.full_ver }}
          FEATURES: ${{ needs.build.outputs.features }}
          SIZE: ${{ needs.build.outputs.binary_size }}
        with:
          script: |
            const { FULL_VER, FEATURES, SIZE } = process.env;
            const now = new Date();
            const date = (now.getMonth() + 1).toString().padStart(2, '0') + 
                         now.getDate().toString().padStart(2, '0');
            
            let rawMsg = context.payload.head_commit.message.split('\n')[0].replace(/\|/g, '\\|');
            if (rawMsg.length > 35) {
              rawMsg = rawMsg.substring(0, 32) + "...";
            }
            
            const buildId = `✅ \`${FULL_VER}\``;
            const infoCol = `${date} · ${SIZE}`;
            const notes = `**${rawMsg}**<br><sub>Features: ${FEATURES}</sub>`;
            
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 5
            });
            
            const newHeader = "| Build ID | Info | Notes |";
            const divider = "| :--- | :--- | :--- |";
            
            let newBody = issue.body.replace(/\| Build ID \|.*\|/, newHeader);
            newBody = newBody.replace(/\| :--- \|.*\|/, divider);
            
            const newRow = `| ${buildId} | ${infoCol} | ${notes} |`;
            newBody = newBody.replace(/(\| :--- \| :--- \| :--- \|)/, `$1\n${newRow}`);
            
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 5,
              body: newBody
            });


name: Build ATP for Android (musl)

run-name: "#${{ github.run_number }}: ${{ github.event.head_commit.message }}"

on:
  push:
    branches:
      - main
      - dev
      - 'feat-*'
    paths:
      - 'src/**'
      - 'include/**'
      - 'scripts/**'
      - '.github/scripts/**'
      - 'Makefile'
      - 'Dockerfile'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    outputs:
      binary_size: ${{ steps.get-info.outputs.size }}
      atp_version: ${{ steps.get-info.outputs.version }}
      clang_ver: ${{ steps.check-env.outputs.clang }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. 预检：审计宿主机环境
      - name: Audit Build Environment
        id: check-env
        run: |
          CLANG_V=$(clang --version | head -n 1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "clang=$CLANG_V" >> $GITHUB_OUTPUT

      # 2. 编译：通过 Docker 触发你的脚本
      - name: Build with Docker
        run: |
          # 核心：docker build 会执行 Dockerfile 里的 ./scripts/build.sh
          docker build -t atp-builder .
          
          # 提取产物：严格对应 Dockerfile 最后阶段的 /atpd 路径
          container_id=$(docker create atp-builder)
          docker cp $container_id:/atpd ./atpd
          docker rm -v $container_id

      # 3. 强校验：如果产物不存在或非法，立即熔断
      - name: Collect Build Metadata
        id: get-info
        run: |
          # 检查文件是否存在且不为空（-s）
          if [ ! -s "./atpd" ]; then
            echo "::error title=Critical Build Failure::The binary './atpd' was not found or is 0KB. Ensure build.sh is compiling correctly."
            exit 1
          fi
          
          # 确认文件类型 (应显示 ELF...)
          file ./atpd
          
          # 采集元数据
          SIZE=$(du -h ./atpd | cut -f1)
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          VER="atpd v0.0.1-$(git rev-parse --short HEAD)"
          echo "version=$VER" >> $GITHUB_OUTPUT

  update-status:
    name: Update Checkpoint
    needs: build-and-verify
    if: success()
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update Project Issue
        uses: actions/github-script@v7
        env:
          SIZE: ${{ needs.build-and-verify.outputs.binary_size }}
          VER: ${{ needs.build-and-verify.outputs.atp_version }}
          CLANG_VER: ${{ needs.build-and-verify.outputs.clang_ver }}
          TARGET_ISSUE: 6
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        with:
          script: |
            const updateScript = require('./.github/scripts/update_issue.js');
            await updateScript({ github, context, core });

name: Build ATP for Android (musl)
run-name: "#${{ github.run_number }}: ${{ github.event.head_commit.message }}"

on:
  push:
    branches: [ '**' ]
    paths: [ 'src/**', 'include/**', 'scripts/**', 'Makefile', 'Dockerfile', '.github/workflows/build.yml' ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Compile and Verify
    runs-on: ubuntu-latest
    outputs:
      v_output: ${{ steps.extract.outputs.v_output }}
      binary_size: ${{ steps.extract.outputs.binary_size }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          outputs: type=local,dest=./dist
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Metadata
        id: extract
        run: |
          V_STR=$(cat ./dist/runtime_version.txt)
          SIZE=$(du -h ./dist/atpd | cut -f1)
          echo "v_output=$V_STR" >> $GITHUB_OUTPUT
          echo "binary_size=$SIZE" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: atpd-build-${{ github.run_number }}
          path: ./dist/atpd

  update-status:
    name: Update Checkpoint
    needs: build-and-verify
    if: |
      success() && 
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Update Project Issue
        uses: actions/github-script@v9
        env:
          V_OUTPUT: ${{ needs.build-and-verify.outputs.v_output }}
          SIZE: ${{ needs.build-and-verify.outputs.binary_size }}
          TARGET_ISSUE: 6
        with:
          script: |
            const { V_OUTPUT, SIZE, TARGET_ISSUE } = process.env;
            const now = new Date();
            const localTime = new Date(now.getTime() + 8 * 3600 * 1000);
            const fmt = (v) => v.toString().padStart(2, '0');
            const ts = `${localTime.getFullYear().toString().slice(-2)}${fmt(localTime.getMonth()+1)}${fmt(localTime.getDate())} ${fmt(localTime.getHours())}:${fmt(localTime.getMinutes())}`;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const shortSha = context.sha.substring(0, 7);

            const newEntry = [
              `<details>`,
              `<summary><span style="white-space: nowrap;">🟢 <b>#${context.runNumber}</b> &nbsp; <code>${ts}</code> &nbsp; 📦 <b>Size:</b> <code>${SIZE}</code></span></summary>`,
              `<p>`,
              ``,
              `> **Build Delivery (Optimized)**`,
              `- 📥 **[Download Build Artifact](${runUrl})**`,
              `- 📝 **Runtime Version (-v):** \`${V_OUTPUT}\``,
              `- 🔗 **Source:** Commit <code>${shortSha}</code>`,
              ``,
              `</p>`,
              `</details>`
            ].join('\n');
            
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(TARGET_ISSUE)
            });
            
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(TARGET_ISSUE),
              body: newEntry + "\n\n" + (issue.body || "")
            });
  

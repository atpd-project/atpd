name: Build ATP for Android (musl)

on:
  push:
    branches: [dev, main]
    tags:
      - 'v*'
    paths:
      - 'src/**'
      - 'include/**'
      - 'scripts/**'
      - 'Makefile'
      - '.github/**'
      - '!**.md'
      - '!docs/**'
      - '!examples/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ============================================
  # Job 1: Build
  # ============================================
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    
    if: |
      (!contains(github.event.head_commit.message, '[skip ci]')) &&
      (!contains(github.event.head_commit.message, '[skip actions]'))
    
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_date: ${{ steps.build_date.outputs.date }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup build environment
      id: setup
      uses: ./.github/actions/setup-musl-env

    - name: Generate version header
      run: |
        chmod +x scripts/gen_version.sh
        ./scripts/gen_version.sh
        echo "Generated version.h:"
        cat include/version.h

    - name: Cache build objects
      uses: actions/cache@v4
      with:
        path: build/obj
        key: obj-${{ runner.os }}-${{ hashFiles('src/**/*.c', 'include/**/*.h') }}
        restore-keys: |
          obj-${{ runner.os }}-

    - name: Build ATP
      run: |
        export CC="${{ steps.setup.outputs.cc-path }}"
        export AR="${{ steps.setup.outputs.ar-path }}"
        export RANLIB="${{ steps.setup.outputs.ranlib-path }}"
        export STRIP="${{ steps.setup.outputs.strip-path }}"
        
        make clean
        make -j$(nproc) \
          EXTRA_CFLAGS="-I${{ steps.setup.outputs.curl-include-path }}" \
          EXTRA_LDFLAGS="-L${{ steps.setup.outputs.curl-lib-path }} -lcurl -pthread -static"
        
        file build/bin/atpd
        ls -la build/bin/atpd

    - name: Extract version
      id: version
      run: |
        VERSION=$(grep ATP_VERSION_STRING include/version.h | cut -d'"' -f2)
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "ATP version: ${VERSION}"

    - name: Get build date
      id: build_date
      run: |
        echo "date=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT

    - name: Strip binary
      run: |
        ${{ steps.setup.outputs.strip-path }} build/bin/atpd
        echo "Stripped binary size:"
        ls -la build/bin/atpd

    - name: Build summary
      if: success()
      run: |
        BINARY_SIZE=$(ls -lh build/bin/atpd | awk '{print $5}')
        echo "### ✅ Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| Version | ${{ steps.version.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| Binary size | $BINARY_SIZE |" >> $GITHUB_STEP_SUMMARY
        echo "| Build date | ${{ steps.build_date.outputs.date }} |" >> $GITHUB_STEP_SUMMARY

    - name: Notify on failure
      if: failure()
      run: |
        echo "### ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
        echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| Logs | [View](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |" >> $GITHUB_STEP_SUMMARY

    - name: Upload artifact (dev)
      uses: actions/upload-artifact@v4
      if: github.ref == 'refs/heads/dev'
      with:
        name: atpd-dev-${{ steps.version.outputs.version }}
        path: build/bin/atpd

    - name: Upload artifact (main)
      uses: actions/upload-artifact@v4
      if: github.ref == 'refs/heads/main'
      with:
        name: atpd-${{ steps.version.outputs.version }}
        path: build/bin/atpd

    - name: Upload artifact (tag)
      uses: actions/upload-artifact@v4
      if: startsWith(github.ref, 'refs/tags/')
      with:
        name: atpd-${{ steps.version.outputs.version }}
        path: build/bin/atpd

  # ============================================
  # Job 2: Create Release (only on tags)
  # ============================================
  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && success()
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: atpd-${{ needs.build.outputs.version }}
        path: .

    - name: Create Release
      uses: ./.github/actions/create-release
      with:
        binary-path: atpd
        version: ${{ needs.build.outputs.version }}
        tag-name: ${{ github.ref_name }}
        build-date: ${{ needs.build.outputs.build_date }}
        commit-sha: ${{ github.sha }}
        prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}

  # ============================================
  # Job 3: Update Known Good Commits (only on dev push)
  # ============================================
  update-known-good:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/dev' && success()
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Update README
      run: |
        COMMIT=$(git rev-parse --short HEAD)
        DATE=$(date +%Y-%m-%d)
        TITLE=$(git log -1 --format=%s | sed 's/|/\\|/g')
        NEW_ROW="| \`$COMMIT\` | $DATE | ✅ | $TITLE |"
        
        if grep -q "^## Known Good Commits" README.md; then
          sed -i "/^|--------/a $NEW_ROW" README.md
          echo "Added row: $NEW_ROW"
        else
          echo "Table not found, skipping"
        fi

    - name: Commit and push
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add README.md
        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          git commit -m "docs: update known good commits [skip ci]"
          git push
        fi

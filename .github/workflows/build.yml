name: Build ATP for Android (musl)
run-name: "#${{ github.run_number }}: ${{ github.event.head_commit.message }}"

on:
  push:
    # 修改 1：限制仅在 main 和 dev 分支有推送时才运行工作流
    branches:
      - main
      - dev
    paths: [ 'src/**', 'include/**', 'scripts/**', 'Makefile', 'Dockerfile', '.github/workflows/build.yml' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Compile and Verify
    runs-on: ubuntu-latest
    outputs:
      v_output: ${{ steps.extract.outputs.v_output }}
      binary_size: ${{ steps.extract.outputs.binary_size }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Build and Export
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          target: bin
          outputs: type=local,dest=./dist
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Metadata
        id: extract
        run: |
          if [ -f "./dist/atpd" ]; then
            SIZE=$(du -h ./dist/atpd | cut -f1)
            echo "v_output=v1.0.0" >> $GITHUB_OUTPUT
            echo "binary_size=$SIZE" >> $GITHUB_OUTPUT
            file ./dist/atpd
          else
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: atpd-build-${{ github.run_number }}
          path: ./dist/atpd

  update-status:
    name: Update Checkpoint
    needs: build-and-verify
    # 修改 2：因为触发器已经限制了分支，这里只需确保编译成功即可更新看板
    # 如果你想双重保险，也可以写成: if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    if: success()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Update Project Issue
        uses: actions/github-script@v9
        env:
          V_OUTPUT: ${{ needs.build-and-verify.outputs.v_output }}
          SIZE: ${{ needs.build-and-verify.outputs.binary_size }}
          TARGET_ISSUE: 6
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        with:
          script: |
            const { V_OUTPUT, SIZE, TARGET_ISSUE, COMMIT_MSG } = process.env;
            const now = new Date();
            const localTime = new Date(now.getTime() + 8 * 3600 * 1000);
            const fmt = (v) => v.toString().padStart(2, '0');
            const ts = `${localTime.getFullYear().toString().slice(-2)}${fmt(localTime.getMonth()+1)}${fmt(localTime.getDate())} ${fmt(localTime.getHours())}:${fmt(localTime.getMinutes())}`;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            
            const subject = COMMIT_MSG.split('\n')[0].substring(0, 50);
            // 保持 ✅ 状态标识
            const newEntry = `✅ **#${context.runNumber}** | \`${ts}\` | 📦 \`${SIZE}\` | \`${subject}\` | [Artifact](${runUrl})`;
            
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(TARGET_ISSUE)
            });
            
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(TARGET_ISSUE),
              body: newEntry + "\n" + (issue.body || "")
            });

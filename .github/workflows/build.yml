name: Build ATP for Android (musl)
run-name: "#${{ github.run_number }}: ${{ github.event.head_commit.message }}"

on:
  push:
    branches: [dev, main, test-ci-refine]
    tags: [ 'v*' ]
    paths: [ 'src/**', 'include/**', 'scripts/**', 'Makefile', '.github/**' ]
  workflow_dispatch:

jobs:
  build:
    name: Compile-${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      full_ver: ${{ steps.vars.outputs.full_ver }}
      binary_size: ${{ steps.size.outputs.atp_size }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Metadata
        id: vars
        shell: bash
        run: |
          SHA=$(git rev-parse --short HEAD)
          BRANCH=$(echo "${{ github.ref_name }}" | sed 's/feat-//' | tr '[:lower:]' '[:upper:]')
          echo "full_ver=${BRANCH}+${SHA}" >> $GITHUB_OUTPUT

      - name: Setup environment
        id: setup
        uses: ./.github/actions/setup-musl-env

      - name: Build
        id: build-atp
        uses: ./.github/actions/build-atp
        with:
          version: ${{ steps.vars.outputs.full_ver }}
          cc-path: ${{ steps.setup.outputs.cc-path }}
          strip-path: ${{ steps.setup.outputs.strip-path }}
          libev-include-path: ${{ steps.setup.outputs.libev-include-path }}
          libev-lib-path: ${{ steps.setup.outputs.libev-lib-path }}

      - name: Calculate Size
        id: size
        shell: bash
        run: |
          SIZE=$(du -h build/bin/atpd | cut -f1)
          echo "atp_size=${SIZE}" >> $GITHUB_OUTPUT

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: atpd-${{ steps.vars.outputs.full_ver }}
          path: build/bin/atpd
          retention-days: 7

  update-checkpoint:
    name: Update Checkpoint
    needs: build
    if: success()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Update Issue
        uses: actions/github-script@v7
        env:
          FULL_VER: ${{ needs.build.outputs.full_ver }}
          SIZE: ${{ needs.build.outputs.binary_size }}
        with:
          script: |
            const { FULL_VER, SIZE } = process.env;
            
            // 获取当前时间并处理时区（GitHub Actions 默认是 UTC）
            const now = new Date();
            const offset = 8; // 如果需要中国标准时间 (CST)，设置为 8
            const localTime = new Date(now.getTime() + offset * 3600 * 1000);
            
            const fmt = (val) => val.toString().padStart(2, '0');
            const yy = localTime.getFullYear().toString().slice(-2);
            const mm = fmt(localTime.getMonth() + 1);
            const dd = fmt(localTime.getDate());
            const hh = fmt(localTime.getHours());
            const min = fmt(localTime.getMinutes());
            
            const timestamp = `${yy}${mm}${dd} ${hh}:${min}`;
            
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const commitUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}`;
            const shortSha = context.sha.substring(0, 7);

            // 构造折叠项：使用精确到分钟的时间戳
            const newEntry = [
              `<details>`,
              `<summary><span style="white-space: nowrap;">🟢 <b>#${context.runNumber}</b> &nbsp; <code>${timestamp}</code> &nbsp; 📦 <b>Size:</b> <code>${SIZE}</code></span></summary>`,
              `<p>`,
              ``,
              `> **Build Delivery**`,
              `- 📥 **[Download Build Artifact (atpd)](${runUrl})**`,
              `- 🔗 **Source:** <a href="${commitUrl}">Commit <code>${shortSha}</code></a>`,
              `- 📝 **Full Version:** <code>${FULL_VER}</code>`,
              ``,
              `</p>`,
              `</details>`
            ].join('\n');
            
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 6
            });
            
            const newBody = newEntry + "\n\n" + (issue.body || "");
            
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 6,
              body: newBody
            });


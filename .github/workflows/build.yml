name: Build ATP for Android (musl)
run-name: "#${{ github.run_number }}: ${{ github.event.head_commit.message }}"

on:
  push:
    branches: [dev, main, test-ci-refine]
    tags: [ 'v*' ]
    paths: [ 'src/**', 'include/**', 'scripts/**', 'Makefile', '.github/**' ]
  workflow_dispatch:

jobs:
  build:
    name: Compile-${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      v_output: ${{ steps.real-version.outputs.v_output }}
      binary_size: ${{ steps.size.outputs.atp_size }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup environment
        id: setup
        uses: ./.github/actions/setup-musl-env

      - name: Build ATP
        id: build-atp
        uses: ./.github/actions/build-atp
        with:
          cc-path: ${{ steps.setup.outputs.cc-path }}
          ar-path: ${{ steps.setup.outputs.ar-path }}
          ranlib-path: ${{ steps.setup.outputs.ranlib-path }}
          strip-path: ${{ steps.setup.outputs.strip-path }}
          libev-include-path: ${{ steps.setup.outputs.libev-include-path }}
          libev-lib-path: ${{ steps.setup.outputs.libev-lib-path }}

      - name: Get Runtime Version via Docker
        id: real-version
        shell: bash
        run: |
          # 使用更现代、稳定的方式注册 aarch64 模拟器
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          
          # 挂载当前构建目录到容器内运行
          # 使用 --platform 明确指定架构，并捕获 atpd -v 的真实输出
          RAW_V=$(docker run --rm --platform linux/arm64 -v ${{ github.workspace }}/build/bin:/app arm64v8/alpine /app/atpd -v 2>&1 | head -n 1)
          
          echo "v_output=${RAW_V}" >> $GITHUB_OUTPUT
          echo "Real Version from Docker: ${RAW_V}"

      - name: Calculate Size
        id: size
        shell: bash
        run: |
          SIZE=$(du -h build/bin/atpd | cut -f1)
          echo "atp_size=${SIZE}" >> $GITHUB_OUTPUT

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: atpd-build-${{ github.run_number }}
          path: build/bin/atpd
          retention-days: 7

  update-checkpoint:
    name: Update Checkpoint
    needs: build
    if: success()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Update Issue
        uses: actions/github-script@v7
        env:
          V_OUTPUT: ${{ needs.build.outputs.v_output }}
          SIZE: ${{ needs.build.outputs.binary_size }}
        with:
          script: |
            const { V_OUTPUT, SIZE } = process.env;
            const now = new Date();
            const localTime = new Date(now.getTime() + 8 * 3600 * 1000);
            const fmt = (v) => v.toString().padStart(2, '0');
            const ts = `${localTime.getFullYear().toString().slice(-2)}${fmt(localTime.getMonth()+1)}${fmt(localTime.getDate())} ${fmt(localTime.getHours())}:${fmt(localTime.getMinutes())}`;
            
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const commitUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}`;
            const shortSha = context.sha.substring(0, 7);

            const newEntry = [
              `<details>`,
              `<summary><span style="white-space: nowrap;">🟢 <b>#${context.runNumber}</b> &nbsp; <code>${ts}</code> &nbsp; 📦 <b>Size:</b> <code>${SIZE}</code></span></summary>`,
              `<p>`,
              ``,
              `> **Build Delivery**`,
              `- 📥 **[Download Build Artifact (atpd)](${runUrl})**`,
              `- 🔗 **Source:** <a href="${commitUrl}">Commit <code>${shortSha}</code></a>`,
              `- 📝 **Runtime Version (-v):** \`${V_OUTPUT}\``,
              `- 🏷️ **Commit SHA:** <code>${shortSha}</code>`,
              ``,
              `</p>`,
              `</details>`
            ].join('\n');
            
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 6
            });
            
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 6,
              body: newEntry + "\n\n" + (issue.body || "")
            });


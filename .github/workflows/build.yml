name: Build ATP for Android (musl)
run-name: "#${{ github.run_number }}: ${{ github.event.head_commit.message }}"

on:
  push:
    branches: [dev, main, test-ci-refine]
    tags: [ 'v*' ]
    paths: [ 'src/**', 'include/**', 'scripts/**', 'Makefile', '.github/**' ]
  workflow_dispatch:

jobs:
  build:
    name: Compile-${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      full_ver: ${{ steps.vars.outputs.full_ver }}
      binary_size: ${{ steps.size.outputs.atp_size }}
      v_output: ${{ steps.version-check.outputs.v_output }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Metadata
        id: vars
        shell: bash
        run: |
          # 缩短版本号以适配源码中的缓冲区限制，防止 snprintf 溢出报错
          SHA=$(git rev-parse --short HEAD)
          echo "full_ver=${SHA}" >> $GITHUB_OUTPUT

      - name: Setup environment
        id: setup
        uses: ./.github/actions/setup-musl-env

      - name: Build
        uses: ./.github/actions/build-atp
        with:
          version: ${{ steps.vars.outputs.full_ver }}
          cc-path: ${{ steps.setup.outputs.cc-path }}
          strip-path: ${{ steps.setup.outputs.strip-path }}
          libev-include-path: ${{ steps.setup.outputs.libev-include-path }}
          libev-lib-path: ${{ steps.setup.outputs.libev-lib-path }}

      - name: Extract Binary Version
        id: version-check
        shell: bash
        run: |
          # 从 aarch64 二进制文件中提取版本字符串
          V_STR=$(strings build/bin/atpd | grep "atp" | head -n 1 || echo "${{ steps.vars.outputs.full_ver }}")
          echo "v_output=$V_STR" >> $GITHUB_OUTPUT

      - name: Calculate Size
        id: size
        shell: bash
        run: |
          SIZE=$(du -h build/bin/atpd | cut -f1)
          echo "atp_size=${SIZE}" >> $GITHUB_OUTPUT

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: atpd-${{ steps.vars.outputs.full_ver }}
          path: build/bin/atpd
          retention-days: 7

  update-checkpoint:
    name: Update Checkpoint
    needs: build
    if: success()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Update Issue
        uses: actions/github-script@v7
        env:
          FULL_VER: ${{ needs.build.outputs.full_ver }}
          SIZE: ${{ needs.build.outputs.binary_size }}
          V_OUTPUT: ${{ needs.build.outputs.v_output }}
        with:
          script: |
            const { FULL_VER, SIZE, V_OUTPUT } = process.env;
            const now = new Date();
            // 修正北京时间 (UTC+8)
            const localTime = new Date(now.getTime() + 8 * 3600 * 1000);
            const fmt = (v) => v.toString().padStart(2, '0');
            const ts = `${localTime.getFullYear().toString().slice(-2)}${fmt(localTime.getMonth()+1)}${fmt(localTime.getDate())} ${fmt(localTime.getHours())}:${fmt(localTime.getMinutes())}`;
            
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const commitUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}`;
            const shortSha = context.sha.substring(0, 7);

            const newEntry = [
              `<details>`,
              `<summary><span style="white-space: nowrap;">🟢 <b>#${context.runNumber}</b> &nbsp; <code>${ts}</code> &nbsp; 📦 <b>Size:</b> <code>${SIZE}</code></span></summary>`,
              `<p>`,
              ``,
              `> **Build Delivery**`,
              `- 📥 **[Download Build Artifact (atpd)](${runUrl})**`,
              `- 🔗 **Source:** <a href="${commitUrl}">Commit <code>${shortSha}</code></a>`,
              `- 📝 **Binary Version:** \`${V_OUTPUT}\``,
              `- 🏷️ **Metadata:** <code>${FULL_VER}</code>`,
              ``,
              `</p>`,
              `</details>`
            ].join('\n');
            
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 6
            });
            
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 6,
              body: newEntry + "\n\n" + (issue.body || "")
            });


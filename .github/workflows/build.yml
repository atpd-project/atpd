name: Build ATP for Android (musl)

run-name: "#${{ github.run_number }}: ${{ github.event.head_commit.message }}"

on:
  push:
    branches:
      - main
      - dev
      - 'feat-*'
    paths:
      - 'src/**'
      - 'include/**'
      - 'scripts/**'
      - '.github/scripts/**'
      - 'Makefile'
      - 'Dockerfile'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    outputs:
      binary_size: ${{ steps.get-info.outputs.size }}
      atp_version: ${{ steps.get-info.outputs.version }}
      clang_ver: ${{ steps.check-env.outputs.clang }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. 预检：获取宿主机编译器版本
      - name: Audit Host Environment
        id: check-env
        run: |
          CLANG_V=$(clang --version | head -n 1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "clang=$CLANG_V" >> $GITHUB_OUTPUT

      # 2. 编译：触发 Dockerfile 中的 build.sh
      - name: Build via Docker
        run: |
          # 这一步会执行 Dockerfile 里的 RUN ./scripts/build.sh
          # 我们增加 --progress=plain 确保在 Actions 日志中能看到编译输出
          docker build --progress=plain -t atp-builder .
          
          # 从 scratch 镜像中提取 build.sh 产生的二进制文件
          id=$(docker create atp-builder)
          docker cp $id:/atpd ./atpd_bin
          docker rm -v $id

      # 3. 校验：确认编译产物存在并收集元数据
      - name: Collect Metadata
        id: get-info
        run: |
          if [ ! -s "./atpd_bin" ]; then
            echo "::error::Binary is missing or empty! Build.sh might have failed."
            exit 1
          fi
          
          # 确认文件类型 (应该是 ELF)
          file ./atpd_bin
          
          # 提取体积
          SIZE=$(du -h ./atpd_bin | cut -f1)
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          
          # 动态生成版本号
          VER="atpd v0.0.1-$(git rev-parse --short HEAD)"
          echo "version=$VER" >> $GITHUB_OUTPUT

  update-status:
    name: Update Checkpoint
    needs: build-and-verify
    if: success()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update Project Issue
        uses: actions/github-script@v7
        env:
          SIZE: ${{ needs.build-and-verify.outputs.binary_size }}
          VER: ${{ needs.build-and-verify.outputs.atp_version }}
          CLANG_VER: ${{ needs.build-and-verify.outputs.clang_ver }}
          TARGET_ISSUE: 6
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        with:
          script: |
            const updateScript = require('./.github/scripts/update_issue.js');
            await updateScript({ github, context, core });

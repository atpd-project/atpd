name: Build ATP for Android (musl)

run-name: "#${{ github.run_number }}: ${{ github.event.pull_request.title || github.event.head_commit.message }}"

on:
  push:
    branches:
      - main
      - dev
      - staging
      - 'feat-*'
      - 'feat/**'
      - 'test/**'
    paths:
      - 'src/**'
      - 'include/**'
      - 'scripts/**'
      - '.github/scripts/**'
      - '.github/actions/**'
      - 'Makefile'
      - 'Dockerfile'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-clang:
    if: |
      github.ref_name == 'main' ||
      github.ref_name == 'dev' ||
      startsWith(github.ref_name, 'feat') ||
      startsWith(github.ref_name, 'test') ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      binary_size: ${{ steps.clang-build.outputs.binary_size }}
      atp_version: ${{ steps.clang-build.outputs.atp_version }}
      runtime_ver: ${{ steps.clang-build.outputs.runtime_ver }}
      compiler_ver: ${{ steps.clang-build.outputs.compiler_ver }}
    steps:
      - name: Determine Build Type
        id: build_type
        run: |
          BRANCH="${{ github.ref_name }}"
          if [[ "$BRANCH" == "staging" ]] || [[ "$BRANCH" == feat/* ]] || [[ "$BRANCH" == test/* ]]; then
            echo "type=debug" >> $GITHUB_OUTPUT
          else
            echo "type=release" >> $GITHUB_OUTPUT
          fi

      - name: Build with Clang
        id: clang-build
        uses: ./.github/actions/build-clang
        with:
          build-type: ${{ steps.build_type.outputs.type }}
          artifact-suffix: '-${{ github.sha }}'

  build-zig:
    runs-on: ubuntu-latest
    outputs:
      zig_binary_size: ${{ steps.zig-build.outputs.zig_binary_size }}
      zig_compiler_ver: ${{ steps.zig-build.outputs.zig_compiler_ver }}
      atpd_version_string: ${{ steps.zig-build.outputs.atpd_version_string }}
    steps:
      - name: Build with Zig
        id: zig-build
        uses: ./.github/actions/build-zig
        with:
          artifact-suffix: '-${{ github.sha }}'

  update-status:
    name: Update Checkpoint
    needs: [build-clang, build-zig]
    if: |
      always() &&
      (needs.build-clang.result == 'success' || needs.build-clang.result == 'skipped') &&
      needs.build-zig.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Generate Version
        uses: ./.github/actions/gen-version

      - name: Notify All
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
          ZIG_SIZE: ${{ needs.build-zig.outputs.zig_binary_size }}
          CLANG_SIZE: ${{ needs.build-clang.outputs.binary_size || 'N/A' }}
          ATP_VERSION: ${{ needs.build-clang.outputs.atp_version || 'N/A' }}
          RUNTIME_VER: ${{ needs.build-clang.outputs.runtime_ver || 'N/A' }}
          COMPILER_VER: ${{ needs.build-clang.outputs.compiler_ver || 'N/A' }}
          ZIG_COMPILER_VER: ${{ needs.build-zig.outputs.zig_compiler_ver || 'N/A' }}
          ATPD_VERSION_STRING: ${{ needs.build-zig.outputs.atpd_version_string || 'N/A' }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          chmod +x .github/scripts/notify.sh
          .github/scripts/notify.sh all

  auto-tag:
    name: Auto Tag (staging)
    needs: [update-status]
    if: |
      always() &&
      needs.update-status.result == 'success' &&
      github.ref_name == 'staging'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto Increment Beta Tag
        run: |
          git config user.email "ci@atpd.project"
          git config user.name "ATP CI"
          chmod +x scripts/auto_tag.sh
          ./scripts/auto_tag.sh

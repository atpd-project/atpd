name: Build ATP for Android (musl)

run-name: "#${{ github.run_number }}: ${{ github.event.head_commit.message }}"

on:
  push:
    branches:
      - main
      - dev
      - 'feat-*'
      - 'feat/**'
    paths:
      - 'src/**'
      - 'include/**'
      - 'scripts/**'
      - '.github/scripts/**'
      - 'Makefile'
      - 'Dockerfile'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    outputs:
      binary_size: ${{ steps.get-info.outputs.size }}
      atp_version: ${{ steps.get-info.outputs.version }}
      clang_ver: ${{ steps.get-info.outputs.clang }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ... 你的编译步骤 ...
      
      - name: Collect Build Metadata
        id: get-info
        run: |
          # 1. 动态获取 Clang 版本
          CLANG_V=$(clang --version | head -n 1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "clang=$CLANG_V" >> $GITHUB_OUTPUT
          
          # 2. 假设你的产物路径是 ./atpd (请根据实际 Makefile 修改)
          # SIZE=$(du -h atpd | cut -f1)
          # echo "size=$SIZE" >> $GITHUB_OUTPUT
          # echo "version=$(./atpd -v)" >> $GITHUB_OUTPUT
          
          # 临时占位符，请确保你的实际编译步骤能覆盖这些变量
          echo "size=328K" >> $GITHUB_OUTPUT
          echo "version=atpd v0.0.1-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

  update-status:
    name: Update Checkpoint
    needs: build-and-verify
    if: success()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update Project Issue
        uses: actions/github-script@v7
        env:
          SIZE: ${{ needs.build-and-verify.outputs.binary_size }}
          VER: ${{ needs.build-and-verify.outputs.atp_version }}
          CLANG_VER: ${{ needs.build-and-verify.outputs.clang_ver }}
          TARGET_ISSUE: 6
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        with:
          script: |
            const updateScript = require('./.github/scripts/update_issue.js');
            await updateScript({ github, context, core });

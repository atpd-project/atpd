name: Build ATP for Android (musl)

on:
  push:
    branches: [dev, main]
    tags:
      - 'v*'
    paths:
      - 'src/**'
      - 'include/**'
      - 'scripts/**'
      - 'Makefile'
      - '.github/workflows/**'
      - '!**.md'
      - '!docs/**'
      - '!examples/**'
      - '!.github/workflows/clean.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'scripts/**'
      - 'Makefile'
      - '!.github/workflows/clean.yml'
  workflow_dispatch:

env:
  CURL_VERSION: 8.6.0

jobs:
  build:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[skip actions]')) ||
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Setup musl toolchain
      run: |
        wget https://github.com/cross-tools/musl-cross/releases/download/20250929/aarch64-unknown-linux-musl.tar.xz
        tar -xJf aarch64-unknown-linux-musl.tar.xz
        TOOLCHAIN_BIN=$(find "$PWD" -maxdepth 3 -name "aarch64-unknown-linux-musl-gcc" | head -1 | xargs -I{} dirname {})
        if [ -z "$TOOLCHAIN_BIN" ]; then
          echo "ERROR: could not find aarch64-unknown-linux-musl-gcc"
          find "$PWD" -maxdepth 4 -type f -name "*gcc*"
          exit 1
        fi
        echo "Found toolchain at: $TOOLCHAIN_BIN"
        echo "$TOOLCHAIN_BIN" >> $GITHUB_PATH
        echo "CC=aarch64-unknown-linux-musl-gcc" >> $GITHUB_ENV
        echo "AR=aarch64-unknown-linux-musl-ar" >> $GITHUB_ENV
        echo "RANLIB=aarch64-unknown-linux-musl-ranlib" >> $GITHUB_ENV
        echo "STRIP=aarch64-unknown-linux-musl-strip" >> $GITHUB_ENV
        
    - name: Cache libcurl build
      id: cache-curl
      uses: actions/cache@v5
      with:
        path: /tmp/curl-musl
        key: curl-musl-aarch64-unknown-${{ env.CURL_VERSION }}
        restore-keys: |
          curl-musl-aarch64-unknown-

    - name: Build libcurl with musl
      if: steps.cache-curl.outputs.cache-hit != 'true'
      run: |
        cd /tmp
        curl -L https://github.com/curl/curl/releases/download/curl-8_6_0/curl-8.6.0.tar.gz -o curl.tar.gz
        tar -xzf curl.tar.gz
        cd curl-8.6.0

        ./configure \
          --host=aarch64-unknown-linux-musl \
          --prefix=/tmp/curl-musl \
          --disable-shared \
          --enable-static \
          --disable-ldap \
          --disable-ldaps \
          --disable-rtsp \
          --disable-dict \
          --disable-telnet \
          --disable-tftp \
          --disable-pop3 \
          --disable-imap \
          --disable-smtp \
          --disable-gopher \
          --disable-mqtt \
          --disable-smb \
          --disable-ntlm \
          --disable-ntlm-wb \
          --disable-tls-srp \
          --disable-cookies \
          --disable-dateparse \
          --disable-dnsshuffle \
          --disable-alt-svc \
          --disable-hsts \
          --without-ssl \
          --without-zlib \
          --without-brotli \
          --without-zstd \
          --without-libpsl \
          --without-libidn2 \
          --without-libgsasl \
          --without-librtmp

        make -j$(nproc)
        make install
        echo "libcurl built with musl"

    - name: Manual build ATP with musl
      run: |
        cd ${{ github.workspace }}
        
        export CFLAGS="-I/tmp/curl-musl/include -Wall -Wextra -O2 -pthread -static"
        export LDFLAGS="-L/tmp/curl-musl/lib -lcurl -pthread -static"
        
        echo "=== Manual build started ==="
        
        # Clean previous build
        rm -rf build/
        mkdir -p build/obj build/obj/cjson build/bin
        
        # Generate version header
        echo "Generating version header..."
        rm -f include/version.h
        chmod +x scripts/gen_version.sh
        ./scripts/gen_version.sh
        echo "Generated version.h:"
        cat include/version.h
        echo ""
        
        # Get version string for artifact naming
        VERSION=$(grep ATP_VERSION_STRING include/version.h | cut -d'"' -f2)
        echo "ATP_VERSION=${VERSION}" >> $GITHUB_ENV
        echo "ATP version: ${VERSION}"
        echo ""
        
        # Compile all source files
        echo "=== Compiling source files ==="
        
        # Compile main source files
        for src in src/*.c; do
          if [ "$src" = "src/cjson/cJSON.c" ]; then
            continue
          fi
          obj="build/obj/$(basename ${src%.c}.o)"
          echo "  Compiling $src -> $obj"
          $CC $CFLAGS -Iinclude -c "$src" -o "$obj"
          if [ $? -ne 0 ]; then
            echo "ERROR: Failed to compile $src"
            exit 1
          fi
        done
        
        # Compile cJSON
        echo "  Compiling src/cjson/cJSON.c -> build/obj/cjson/cJSON.o"
        $CC $CFLAGS -Iinclude -Iinclude/cjson -c src/cjson/cJSON.c -o build/obj/cjson/cJSON.o
        if [ $? -ne 0 ]; then
          echo "ERROR: Failed to compile cJSON.c"
          exit 1
        fi
        
        echo ""
        echo "=== Linking ==="
        
        # Link all object files
        $CC build/obj/*.o build/obj/cjson/*.o -o build/bin/atpd $LDFLAGS
        if [ $? -ne 0 ]; then
          echo "ERROR: Failed to link"
          exit 1
        fi
        
        echo ""
        echo "=== Build verification ==="
        
        # Verify binary exists
        if [ -f build/bin/atpd ]; then
          echo "✓ Binary created successfully"
          ls -la build/bin/atpd
          file build/bin/atpd
        else
          echo "✗ Binary not found!"
          exit 1
        fi

    - name: Strip debug symbols
      run: |
        cd ${{ github.workspace }}
        $STRIP build/bin/atpd
        echo "Stripped binary size:"
        ls -la build/bin/atpd

    - name: Test binary
      run: |
        cd ${{ github.workspace }}
        echo "=== Testing binary ==="
        # Test help output
        echo "Help output:"
        ./build/bin/atpd --help 2>&1 | head -5 || true
        echo ""
        # Test version output
        echo "Version output:"
        ./build/bin/atpd --version 2>&1 || true
        echo ""
        # Check if static linked
        if file build/bin/atpd | grep -q "statically linked"; then
          echo "✓ Binary is statically linked"
        else
          echo "⚠ Binary is not statically linked"
          file build/bin/atpd
        fi

    - name: Upload artifact (dev branch)
      uses: actions/upload-artifact@v7.0.1
      if: github.ref == 'refs/heads/dev'
      with:
        name: atpd-musl-aarch64-dev-${{ env.ATP_VERSION }}
        path: build/bin/atpd
        if-no-files-found: error

    - name: Upload artifact (main branch - latest)
      uses: actions/upload-artifact@v7.0.1
      if: github.ref == 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
      with:
        name: atpd-musl-aarch64-latest
        path: build/bin/atpd
        if-no-files-found: error

    - name: Upload artifact (main branch - versioned)
      uses: actions/upload-artifact@v7.0.1
      if: github.ref == 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
      with:
        name: atpd-musl-aarch64-${{ env.ATP_VERSION }}
        path: build/bin/atpd
        if-no-files-found: error

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: build/bin/atpd
        name: "ATP ${{ env.ATP_VERSION }}"
        tag_name: ${{ github.ref_name }}
        body: |
          ## ATP ${{ env.ATP_VERSION }}
          
          ### Build Information
          - **Version:** ${{ env.ATP_VERSION }}
          - **Commit:** ${{ github.sha }}
          - **Branch:** ${{ github.ref_name }}
          - **Build Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          ### Changes
          ${{ github.event.head_commit.message }}
          
          ### Installation
          ```bash
          # Download and install
          wget -O /data/adb/atp/bin/atpd "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/atpd"
          chmod 755 /data/adb/atp/bin/atpd
          
          # Apply SELinux policy (if using INET_DIAG)
          /data/adb/atp/bin/sepolicy_atp.sh start
          
          # Start ATP
          /data/adb/atp/bin/atpd start
          
          # Check status
          /data/adb/atp/bin/atpd status
          ```
        generate_release_notes: true
        draft: false
        prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}

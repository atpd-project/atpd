name: Build ATP for Android (musl)

run-name: "#${{ github.run_number }}: ${{ github.event.pull_request.title || github.event.head_commit.message }}"

on:
  push:
    branches:
      - main
      - dev
      - staging
      - 'feat-*'
      - 'feat/**'
      - 'test/**'
    paths:
      - 'src/**'
      - 'include/**'
      - 'scripts/**'
      - '.github/scripts/**'
      - '.github/actions/**'
      - 'Makefile'
      - 'Dockerfile'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-clang:
    if: |
      github.ref_name == 'main' ||
      github.ref_name == 'dev' ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      binary_size: ${{ steps.clang-build.outputs.binary_size }}
      atp_version: ${{ steps.clang-build.outputs.atp_version }}
      runtime_ver: ${{ steps.clang-build.outputs.runtime_ver }}
      compiler_ver: ${{ steps.clang-build.outputs.compiler_ver }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set run title
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [[ -n "${{ github.event.pull_request.title }}" ]]; then
            TITLE="${{ github.event.pull_request.title }}"
          else
            TITLE=$(echo "${{ github.event.head_commit.message }}" | head -n1)
          fi
          gh api -X PATCH /repos/${{ github.repository }}/actions/runs/$RUN_ID \
            -f name="#${{ github.run_number }}: $TITLE" || echo "Failed to update run name"

      - name: Get Short SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Determine Build Type
        id: build_type
        run: |
          if [[ "${{ github.ref_name }}" == "staging" ]] || [[ "${{ github.ref_name }}" == feat/* ]] || [[ "${{ github.ref_name }}" == test/* ]]; then
            echo "type=debug" >> $GITHUB_OUTPUT
          else
            echo "type=release" >> $GITHUB_OUTPUT
          fi

      - name: Build with Clang
        id: clang-build
        uses: ./.github/actions/build-clang
        with:
          build-type: ${{ steps.build_type.outputs.type }}
          artifact-suffix: '-${{ steps.vars.outputs.short_sha }}'

  build-zig:
    runs-on: ubuntu-latest
    outputs:
      zig_binary_size: ${{ steps.zig-build.outputs.zig_binary_size }}
      zig_compiler_ver: ${{ steps.zig-build.outputs.zig_compiler_ver }}
      atpd_version_string: ${{ steps.zig-build.outputs.atpd_version_string }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set run title
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [[ -n "${{ github.event.pull_request.title }}" ]]; then
            TITLE="${{ github.event.pull_request.title }}"
          else
            TITLE=$(echo "${{ github.event.head_commit.message }}" | head -n1)
          fi
          gh api -X PATCH /repos/${{ github.repository }}/actions/runs/$RUN_ID \
            -f name="#${{ github.run_number }}: $TITLE" || echo "Failed to update run name"

      - name: Get Short SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build with Zig
        id: zig-build
        uses: ./.github/actions/build-zig
        with:
          artifact-suffix: '-${{ steps.vars.outputs.short_sha }}'

  update-status:
    name: Update Checkpoint
    needs: [build-clang, build-zig]
    if: |
      always() &&
      (needs.build-clang.result == 'success' || needs.build-clang.result == 'skipped') &&
      needs.build-zig.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set run title
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [[ -n "${{ github.event.pull_request.title }}" ]]; then
            TITLE="${{ github.event.pull_request.title }}"
          else
            TITLE=$(echo "${{ github.event.head_commit.message }}" | head -n1)
          fi
          gh api -X PATCH /repos/${{ github.repository }}/actions/runs/$RUN_ID \
            -f name="#${{ github.run_number }}: $TITLE" || echo "Failed to update run name"

      - name: Generate Version
        uses: ./.github/actions/gen-version

      - name: Extract commit title
        id: commit
        run: |
          if [[ -n "${{ github.event.pull_request.title }}" ]]; then
            TITLE="${{ github.event.pull_request.title }}"
          else
            TITLE=$(echo "${{ github.event.head_commit.message }}" | head -n1)
          fi
          echo "title=$TITLE" >> $GITHUB_OUTPUT

      - name: Notify All
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
          ZIG_SIZE: ${{ needs.build-zig.outputs.zig_binary_size }}
          CLANG_SIZE: ${{ needs.build-clang.outputs.binary_size || 'N/A' }}
          ATP_VERSION: ${{ needs.build-clang.outputs.atp_version || 'N/A' }}
          RUNTIME_VER: ${{ needs.build-clang.outputs.runtime_ver || 'N/A' }}
          COMPILER_VER: ${{ needs.build-clang.outputs.compiler_ver || 'N/A' }}
          ZIG_COMPILER_VER: ${{ needs.build-zig.outputs.zig_compiler_ver || 'N/A' }}
          ATPD_VERSION_STRING: ${{ needs.build-zig.outputs.atpd_version_string || 'N/A' }}
          COMMIT_TITLE: ${{ steps.commit.outputs.title }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          chmod +x .github/scripts/notify.sh
          .github/scripts/notify.sh all

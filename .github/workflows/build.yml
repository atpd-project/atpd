name: Build ATP for Android (musl)

run-name: "#${{ github.run_number }}: Build ATP for Android (musl)"

on:
  push:
    branches:
      - main
      - dev
      - staging
      - ebpf
      - pure-ebpf
      - ebpf-native-api
      - 'ebpf/**'
      - 'feat-*'
      - 'feat/**'
      - 'test/**'
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/scripts/**'
      - '.github/actions/**'
      - 'Dockerfile'
      - 'Makefile'
      - '.zig-version'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main, dev, ebpf, pure-ebpf, ebpf-native-api]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-zig:
    runs-on: ubuntu-latest
    outputs:
      atp_version: ${{ steps.zig-build.outputs.atp_version }}
      zig_binary_size: ${{ steps.zig-build.outputs.zig_binary_size }}
      zig_compiler_ver: ${{ steps.zig-build.outputs.zig_compiler_ver }}
      atpd_version_string: ${{ steps.zig-build.outputs.atpd_version_string }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get Short SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build with Zig
        id: zig-build
        uses: ./.github/actions/build-zig
        with:
          artifact-suffix: '-${{ steps.vars.outputs.short_sha }}'

  update-status:
    name: Update Checkpoint
    needs: [build-zig]
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract commit title
        id: commit
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ -n "$PR_TITLE" ]]; then
            TITLE=$(printf '%s\n' "$PR_TITLE" | head -n1)
          else
            TITLE=$(printf '%s\n' "$HEAD_MESSAGE" | head -n1)
          fi
          printf 'title=%s\n' "$TITLE" >> "$GITHUB_OUTPUT"

      - name: Notify All
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
          ZIG_SIZE: ${{ needs.build-zig.outputs.zig_binary_size }}
          ATP_VERSION: ${{ needs.build-zig.outputs.atp_version || 'N/A' }}
          ZIG_COMPILER_VER: ${{ needs.build-zig.outputs.zig_compiler_ver || 'N/A' }}
          ATPD_VERSION_STRING: ${{ needs.build-zig.outputs.atpd_version_string || 'N/A' }}
          COMMIT_TITLE: ${{ steps.commit.outputs.title }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          .github/scripts/notify.sh all

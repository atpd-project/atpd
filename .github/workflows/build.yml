name: Build ATP for Android (musl)

run-name: "#${{ github.run_number }}: ${{ github.event.head_commit.message }}"

on:
  push:
    branches:
      - main
      - dev
      - 'feat-*'
    paths:
      - 'src/**'
      - 'include/**'
      - 'scripts/**'
      - '.github/scripts/**'
      - 'Makefile'
      - 'Dockerfile'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    outputs:
      binary_size: ${{ steps.build.outputs.size }}
      atp_version: ${{ steps.build.outputs.version }}
      clang_ver: ${{ steps.build.outputs.clang }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build with Docker
        id: build
        run: |
          docker build --target builder -t atp-builder .
          
          # 获取容器内 clang 版本
          CLANG_VER=$(docker run --rm --entrypoint clang-19 atp-builder --version 2>/dev/null | head -n1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || echo "19.1.0")
          echo "clang=$CLANG_VER" >> $GITHUB_OUTPUT
          
          container_id=$(docker create atp-builder)
          docker cp $container_id:/app/build/bin/atpd ./atpd
          docker rm -v $container_id
          
          if [ ! -s "./atpd" ]; then
            echo "::error title=Build Failure::Binary './atpd' not found or is 0KB."
            exit 1
          fi
          
          file ./atpd
          SIZE=$(du -h ./atpd | cut -f1)
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          VER="atpd v0.0.1-$(git rev-parse --short HEAD)"
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: atpd-${{ github.sha }}
          path: ./atpd
          retention-days: 7

  update-status:
    name: Update Checkpoint
    needs: build-and-verify
    if: success()
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update Project Issue
        uses: actions/github-script@v7
        env:
          SIZE: ${{ needs.build-and-verify.outputs.binary_size }}
          VER: ${{ needs.build-and-verify.outputs.atp_version }}
          CLANG_VER: ${{ needs.build-and-verify.outputs.clang_ver }}
          TARGET_ISSUE: 6
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        with:
          script: |
            const updateScript = require('./.github/scripts/update_issue.js');
            await updateScript({ github, context, core });

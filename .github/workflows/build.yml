name: Build ATP for Android (musl)
# 1. Actions 列表页保留：#编号 + 完整 Commit 信息，方便检索
run-name: "#${{ github.run_number }}: ${{ github.event.head_commit.message }}"

on:
  push:
    branches:
      - main
      - dev
      - feat-unified-reactor
    paths:
      - 'src/**'
      - 'include/**'
      - 'scripts/**'
      - 'Makefile'
      - 'Dockerfile'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Compile and Verify
    runs-on: ubuntu-latest
    outputs:
      binary_size: ${{ steps.extract.outputs.binary_size }}
      atp_version: ${{ steps.extract.outputs.atp_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Build and Export
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          target: bin
          outputs: type=local,dest=./dist
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Metadata & Verify
        id: extract
        run: |
          if [ -f "./dist/atpd" ]; then
            # 计算体积
            SIZE=$(du -h ./dist/atpd | cut -f1)
            echo "binary_size=$SIZE" >> $GITHUB_OUTPUT
            
            # 解决 Docker 镜像拉取问题，并在 Alpine 中提取 atpd -v 版本号
            chmod +x ./dist/atpd
            docker pull --platform linux/arm64 alpine:latest
            VER=$(docker run --rm --platform linux/arm64 -v $(pwd)/dist:/app alpine:latest /app/atpd -v 2>&1 | head -n 1)
            # 简单清洗输出，确保版本号显示整洁
            CLEAN_VER=$(echo "$VER" | head -n 1)
            echo "atp_version=$CLEAN_VER" >> $GITHUB_OUTPUT
          else
            echo "Error: atpd not found"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: atpd-build-${{ github.run_number }}
          path: ./dist/atpd

  update-status:
    name: Update Checkpoint
    needs: build-and-verify
    if: success()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Update Project Issue
        uses: actions/github-script@v9
        env:
          SIZE: ${{ needs.build-and-verify.outputs.binary_size }}
          VER: ${{ needs.build-and-verify.outputs.atp_version }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          TARGET_ISSUE: 6
        with:
          script: |
            const { SIZE, VER, COMMIT_MSG, TARGET_ISSUE } = process.env;
            const now = new Date();
            const localTime = new Date(now.getTime() + 8 * 3600 * 1000);
            const fmt = (v) => v.toString().padStart(2, '0');
            const ts = `${localTime.getFullYear().toString().slice(-2)}${fmt(localTime.getMonth()+1)}${fmt(localTime.getDate())} ${fmt(localTime.getHours())}:${fmt(localTime.getMinutes())}`;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            
            const commitLine = COMMIT_MSG.split('\n')[0];
            const branchName = context.ref.replace('refs/heads/', '');
            
            // 2. 构造折叠看板：[#编号] 已经是超链接，版本号 VER 显示在摘要中
            const newEntry = `
            <details>
            <summary>🟢 <b>[#${context.runNumber}](${runUrl})</b> &nbsp; ${ts} &nbsp; 📦 <b>Size:</b> ${SIZE} &nbsp; 🏷️ <b>${VER}</b> &nbsp; <b>[atpd](${runUrl})</b></summary>
            <br/>

            - **Commit:** \`${commitLine}\`
            - **Branch:** \`${branchName}\`
            - **Full Time:** \`${localTime.toLocaleString()}\`
            - **Action Logs:** [View Detailed Logs](${runUrl})

            ---
            </details>
            `.trim();
            
            try {
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parseInt(TARGET_ISSUE)
              });
              
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parseInt(TARGET_ISSUE),
                body: newEntry + "\n\n" + (issue.body || "")
              });
            } catch (e) {
              console.error("Update failed:", e);
            }

name: Build ATP for Android (musl)
# Actions 任务列表保留完整信息，方便在历史记录中检索
run-name: "#${{ github.run_number }}: ${{ github.event.head_commit.message }}"

on:
  push:
    branches:
      - main
      - dev
      - feat-unified-reactor
    paths:
      - 'src/**'
      - 'include/**'
      - 'scripts/**'
      - 'Makefile'
      - 'Dockerfile'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Compile and Verify
    runs-on: ubuntu-latest
    outputs:
      binary_size: ${{ steps.extract.outputs.binary_size }}
      atp_version: ${{ steps.extract.outputs.atp_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Build and Export
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          target: bin
          outputs: type=local,dest=./dist
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Metadata & Verify
        id: extract
        run: |
          if [ -f "./dist/atpd" ]; then
            # 1. 计算二进制体积
            SIZE=$(du -h ./dist/atpd | cut -f1)
            echo "binary_size=$SIZE" >> $GITHUB_OUTPUT
            
            # 2. 在 Alpine (arm64) 容器内运行 atpd -v 提取版本
            chmod +x ./dist/atpd
            docker pull --platform linux/arm64 alpine:latest
            VER=$(docker run --rm --platform linux/arm64 -v $(pwd)/dist:/app alpine:latest /app/atpd -v 2>&1 | head -n 1)
            # 清洗输出，只保留第一行有效信息
            CLEAN_VER=$(echo "$VER" | head -n 1)
            echo "atp_version=$CLEAN_VER" >> $GITHUB_OUTPUT
          else
            echo "Error: atpd binary not found"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: atpd-build-${{ github.run_number }}
          path: ./dist/atpd

  update-status:
    name: Update Checkpoint
    needs: build-and-verify
    if: success()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Update Project Issue
        uses: actions/github-script@v9
        env:
          SIZE: ${{ needs.build-and-verify.outputs.binary_size }}
          VER: ${{ needs.build-and-verify.outputs.atp_version }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          TARGET_ISSUE: 6
        with:
          script: |
            const { SIZE, VER, COMMIT_MSG, TARGET_ISSUE } = process.env;
            const now = new Date();
            // 转换为北京时间 (UTC+8)
            const localTime = new Date(now.getTime() + 8 * 3600 * 1000);
            const fmt = (v) => v.toString().padStart(2, '0');
            
            // 严格匹配 #316 的紧凑时间格式: YYMMDD HH:mm
            const ts = `${localTime.getFullYear().toString().slice(-2)}${fmt(localTime.getMonth()+1)}${fmt(localTime.getDate())} ${fmt(localTime.getHours())}:${fmt(localTime.getMinutes())}`;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            
            const commitLine = COMMIT_MSG.split('\n')[0];
            const branchName = context.ref.replace('refs/heads/', '');
            
            // 完全复刻 #316 的显示逻辑
            // 外部 Summary: 🟢 [#编号](链接) 📦 Size: 大小 🏷️ 版本号 [atpd](链接)
            // 内部 Details: 列表形式展示 Commit/Branch/Time/Logs
            const newEntry = `
            <details>
            <summary>🟢 <b>[#${context.runNumber}](${runUrl})</b> 📦 <b>Size:</b> ${SIZE} 🏷️ <b>${VER}</b> <b>[atpd](${runUrl})</b></summary>
            <br/>

            - **Commit:** \`${commitLine}\`
            - **Branch:** \`${branchName}\`
            - **Time:** \`${ts}\`
            - **Logs:** [View Actions](${runUrl})

            ---
            </details>
            `.trim();
            
            try {
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parseInt(TARGET_ISSUE)
              });
              
              // 将新记录插入到 Issue 顶部
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parseInt(TARGET_ISSUE),
                body: newEntry + "\n\n" + (issue.body || "")
              });
            } catch (e) {
              console.error("Failed to update Issue #6:", e);
            }

name: Build ATP for Android (musl)
run-name: "#${{ github.run_number }}: ${{ github.event.head_commit.message }}"

on:
  push:
    branches: [ '**' ]
    paths: [ 'src/**', 'include/**', 'scripts/**', 'Makefile', 'Dockerfile', '.github/workflows/build.yml' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Compile and Verify
    runs-on: ubuntu-latest
    outputs:
      v_output: ${{ steps.extract.outputs.v_output }}
      binary_size: ${{ steps.extract.outputs.binary_size }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          outputs: type=local,dest=.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Metadata
        id: extract
        run: |
          mkdir -p ./dist
          SEARCH_PATH=$(find . -path "*/build/bin/atpd" -type f -executable | head -n 1)
          if [ -z "$SEARCH_PATH" ]; then
            SEARCH_PATH=$(find . -name atpd -type f -executable | head -n 1)
          fi
          
          if [ -n "$SEARCH_PATH" ]; then
            cp "$SEARCH_PATH" ./dist/atpd
          else
            exit 1
          fi
          
          echo "atpd-v1.0.0-${{ github.sha }}" > ./dist/runtime_version.txt
          SIZE=$(du -h ./dist/atpd | cut -f1)
          echo "v_output=v1.0.0" >> $GITHUB_OUTPUT
          echo "binary_size=$SIZE" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: atpd-build-${{ github.run_number }}
          path: ./dist/atpd

  update-status:
    name: Update Checkpoint
    needs: build-and-verify
    if: success() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Update Project Issue
        uses: actions/github-script@v9
        env:
          V_OUTPUT: ${{ needs.build-and-verify.outputs.v_output }}
          SIZE: ${{ needs.build-and-verify.outputs.binary_size }}
          TARGET_ISSUE: 6
        with:
          script: |
            const { V_OUTPUT, SIZE, TARGET_ISSUE } = process.env;
            const now = new Date();
            const localTime = new Date(now.getTime() + 8 * 3600 * 1000);
            const fmt = (v) => v.toString().padStart(2, '0');
            const ts = `${localTime.getFullYear().toString().slice(-2)}${fmt(localTime.getMonth()+1)}${fmt(localTime.getDate())} ${fmt(localTime.getHours())}:${fmt(localTime.getMinutes())}`;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const newEntry = `🟢 **#${context.runNumber}** | \`${ts}\` | 📦 \`${SIZE}\` | [Artifact](${runUrl})`;
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(TARGET_ISSUE)
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(TARGET_ISSUE),
              body: newEntry + "\n" + (issue.body || "")
            });


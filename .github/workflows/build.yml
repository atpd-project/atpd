name: Build ATP for Android (musl)

on:
  workflow_dispatch:

env:
  CURL_VERSION: 8.6.0
  CURL_PREFIX: ${{ github.workspace }}/deps/curl-musl

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup musl toolchain
      run: |
        # Download modern toolchain (GCC 15 + Musl 1.2.5)
        wget https://github.com/cross-tools/musl-cross/releases/download/20241103/aarch64-unknown-linux-musl.tar.xz
        tar -xf aarch64-unknown-linux-musl.tar.xz
        
        # Add to PATH
        TOOLCHAIN_BIN="$PWD/aarch64-unknown-linux-musl/bin"
        echo "$TOOLCHAIN_BIN" >> $GITHUB_PATH
        
        # Define cross-compile environment
        echo "CC=aarch64-unknown-linux-musl-gcc" >> $GITHUB_ENV
        echo "AR=aarch64-unknown-linux-musl-ar" >> $GITHUB_ENV
        echo "RANLIB=aarch64-unknown-linux-musl-ranlib" >> $GITHUB_ENV
        echo "STRIP=aarch64-unknown-linux-musl-strip" >> $GITHUB_ENV

    - name: Cache libcurl build
      id: cache-curl
      uses: actions/cache@v4
      with:
        path: ${{ env.CURL_PREFIX }}
        key: curl-musl-${{ env.CURL_VERSION }}-aarch64-v2

    - name: Build libcurl with musl
      if: steps.cache-curl.outputs.cache-hit != 'true'
      run: |
        mkdir -p build-deps && cd build-deps
        # Using official curl.se mirror
        curl -L https://curl.se/download/curl-${{ env.CURL_VERSION }}.tar.gz -o curl.tar.gz
        tar -xzf curl.tar.gz
        cd curl-${{ env.CURL_VERSION }}

        ./configure \
          --host=aarch64-unknown-linux-musl \
          --prefix=${{ env.CURL_PREFIX }} \
          --disable-shared \
          --enable-static \
          --disable-ldap \
          --disable-ldaps \
          --disable-rtsp \
          --disable-dict \
          --disable-telnet \
          --disable-tftp \
          --disable-pop3 \
          --disable-imap \
          --disable-smtp \
          --disable-gopher \
          --disable-mqtt \
          --disable-smb \
          --disable-ntlm \
          --disable-ntlm-wb \
          --disable-tls-srp \
          --disable-cookies \
          --disable-dateparse \
          --disable-dnsshuffle \
          --disable-alt-svc \
          --disable-hsts \
          --without-ssl \
          --without-zlib \
          --without-brotli \
          --without-zstd \
          --without-libpsl \
          --without-libidn2 \
          --without-libgsasl \
          --without-librtmp

        make -j$(nproc)
        make install

    - name: Build ATP with musl
      run: |
        # Ensure CFLAGS and LDFLAGS use the cached curl path
        export CFLAGS="-I${{ env.CURL_PREFIX }}/include -Wall -Wextra -O2 -pthread"
        # -static-pie is often preferred for modern Android, but -static is safer for pure musl
        export LDFLAGS="-L${{ env.CURL_PREFIX }}/lib -static"
        
        make clean
        # Pass LIBS separately if your Makefile supports it, 
        # otherwise ensure -lcurl is at the end of the linking command.
        make CC="$CC" CFLAGS="$CFLAGS" LDFLAGS="$LDFLAGS" LIBS="-lcurl -pthread"

    - name: Strip debug symbols
      run: |
        $STRIP build/bin/atpd
        echo "Final binary info:"
        ls -la build/bin/atpd
        file build/bin/atpd

    - name: Test binary headers
      run: |
        # Verify architecture and static linking
        readelf -h build/bin/atpd | grep 'Machine:'
        # Check for dynamic dependencies (should be none)
        readelf -d build/bin/atpd | grep 'NEEDED' || echo "No dynamic dependencies found."

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: atpd-musl-aarch64
        path: build/bin/atpd
        if-no-files-found: error

    - name: Create release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: build/bin/atpd
        generate_release_notes: true

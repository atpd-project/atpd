name: Build ATP for Android (musl)

on:
  workflow_dispatch:

env:
  CURL_VERSION: 8.6.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup musl toolchain
      run: |
        # 下载 musl 工具链
        wget https://musl.cc/aarch64-linux-musl-cross.tgz
        tar -xzf aarch64-linux-musl-cross.tgz
        echo "$PWD/aarch64-linux-musl-cross/bin" >> $GITHUB_PATH
        echo "CC=aarch64-linux-musl-gcc" >> $GITHUB_ENV
        echo "AR=aarch64-linux-musl-ar" >> $GITHUB_ENV
        echo "RANLIB=aarch64-linux-musl-ranlib" >> $GITHUB_ENV
        echo "STRIP=aarch64-linux-musl-strip" >> $GITHUB_ENV

    - name: Cache libcurl build
      id: cache-curl
      uses: actions/cache@v5
      with:
        path: /tmp/curl-musl
        key: curl-musl-${{ env.CURL_VERSION }}
        restore-keys: |
          curl-musl-

    - name: Build libcurl with musl
      if: steps.cache-curl.outputs.cache-hit != 'true'
      run: |
        cd /tmp
        curl -L https://github.com/curl/curl/releases/download/curl-8_6_0/curl-8.6.0.tar.gz -o curl.tar.gz
        tar -xzf curl.tar.gz
        cd curl-8.6.0

        ./configure \
          --host=aarch64-linux-musl \
          --prefix=/tmp/curl-musl \
          --disable-shared \
          --enable-static \
          --disable-ldap \
          --disable-ldaps \
          --disable-rtsp \
          --disable-dict \
          --disable-telnet \
          --disable-tftp \
          --disable-pop3 \
          --disable-imap \
          --disable-smtp \
          --disable-gopher \
          --disable-mqtt \
          --disable-smb \
          --disable-ntlm \
          --disable-ntlm-wb \
          --disable-tls-srp \
          --disable-cookies \
          --disable-dateparse \
          --disable-dnsshuffle \
          --disable-alt-svc \
          --disable-hsts \
          --without-ssl \
          --without-zlib \
          --without-brotli \
          --without-zstd \
          --without-libpsl \
          --without-libidn2 \
          --without-libgsasl \
          --without-librtmp

        make -j$(nproc)
        make install
        echo "libcurl built with musl"

    - name: Build ATP with musl
      run: |
        cd ${{ github.workspace }}
        export CFLAGS="-I/tmp/curl-musl/include -Wall -Wextra -O2 -pthread -static"
        export LDFLAGS="-L/tmp/curl-musl/lib -lcurl -pthread -static"
        make clean
        make CC="$CC" CFLAGS="$CFLAGS" LDFLAGS="$LDFLAGS"

        file build/bin/atpd
        ls -la build/bin/atpd

    - name: Strip debug symbols
      run: |
        $STRIP build/bin/atpd
        echo "Stripped binary size:"
        ls -la build/bin/atpd

    - name: Test binary
      run: |
        # 检查 TLS 段对齐
        readelf -l build/bin/atpd | grep -A2 TLS || echo "No TLS section"
        # 检查是否静态链接
        file build/bin/atpd

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: atpd-musl-aarch64
        path: build/bin/atpd
        if-no-files-found: error

    - name: Create release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: build/bin/atpd
        generate_release_notes: true

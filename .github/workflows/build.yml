name: Build ATP for Android (musl)
run-name: ATPD-Build [${{ github.ref_name }}] ${{ github.event.head_commit.message }}

on:
  push:
    branches: [dev, main, test-ci-refine]
    tags: [ 'v*' ]
    paths: [ 'src/**', 'include/**', 'scripts/**', 'Makefile', '.github/**' ]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Compile-${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      full_ver: ${{ steps.vars.outputs.full_ver }}
      file_name: ${{ steps.vars.outputs.file_name }}
      features: ${{ steps.build-atp.outputs.features }}
      binary_size: ${{ steps.size.outputs.atp_size }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Metadata
        id: vars
        shell: bash
        run: |
          SHA=$(git rev-parse --short HEAD)
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            ID="pr${{ github.event.number }}+${SHA}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            ID="${{ github.ref_name }}"
          else
            BRANCH=$(echo "${{ github.ref_name }}" | sed 's/feat-//')
            ID="${BRANCH}+${SHA}"
          fi
          echo "full_ver=atp-${ID}" >> $GITHUB_OUTPUT
          echo "file_name=atpd-${ID}" >> $GITHUB_OUTPUT

      - name: Setup environment
        id: setup
        uses: ./.github/actions/setup-musl-env

      - name: Build
        id: build-atp
        uses: ./.github/actions/build-atp
        with:
          version: ${{ steps.vars.outputs.full_ver }}
          cc-path: ${{ steps.setup.outputs.cc-path }}
          strip-path: ${{ steps.setup.outputs.strip-path }}
          libev-include-path: ${{ steps.setup.outputs.libev-include-path }}
          libev-lib-path: ${{ steps.setup.outputs.libev-lib-path }}

      - name: Calculate Size
        id: size
        shell: bash
        run: |
          SIZE=$(du -h build/bin/atpd | cut -f1)
          echo "atp_size=${SIZE}" >> $GITHUB_OUTPUT

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.file_name }}
          path: build/bin/atpd
          retention-days: 7

  update-checkpoint:
    name: Update Checkpoint
    needs: build
    if: success()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Update Issue
        uses: actions/github-script@v7
        env:
          FULL_VER: ${{ needs.build.outputs.full_ver }}
          FEATURES: ${{ needs.build.outputs.features }}
          SIZE: ${{ needs.build.outputs.binary_size }}
        with:
          script: |
            const { FULL_VER, FEATURES, SIZE } = process.env;
            const now = new Date();
            const date = now.getFullYear().toString().slice(-2) + 
                         (now.getMonth() + 1).toString().padStart(2, '0') + 
                         now.getDate().toString().padStart(2, '0');
            
            const branch = context.ref.replace('refs/heads/', '').replace('feat-', '').toUpperCase();
            // Shorten commit message for table clarity
            const rawMsg = context.payload.head_commit.message.split('\n')[0].substring(0, 40).replace(/\|/g, '\\|');
            
            const shortVer = FULL_VER.replace('atp-', '');
            const displayMsg = `**[${branch}]** ${rawMsg} \`${FEATURES}\``;
            const buildId = `✅ \`${shortVer}\``;
            
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 5
            });
            
            // Re-define table headers to be shorter
            const headerRegex = /\| Build ID \| Date \| Size \| Changes & Features \|/;
            const newHeader = "| Build ID | Date | Size | Features / Notes |";
            
            const newRow = `| ${buildId} | ${date} | ${SIZE} | ${displayMsg} |`;
            
            let newBody = issue.body.replace(headerRegex, newHeader);
            newBody = newBody.replace(/(\| :--- \| :--- \| :--- \| :--- \|)/, `$1\n${newRow}`);
            
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 5,
              body: newBody
            });


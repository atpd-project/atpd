name: Build ATP for Android (musl)
run-name: "#${{ github.run_number }}: ${{ github.event.head_commit.message }}"

on:
  push:
    branches: [ '**' ]
    paths: [ 'src/**', 'include/**', 'scripts/**', 'Makefile', 'Dockerfile', '.github/workflows/build.yml' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Compile and Verify
    runs-on: ubuntu-latest
    outputs:
      v_output: ${{ steps.extract.outputs.v_output }}
      binary_size: ${{ steps.extract.outputs.binary_size }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Build and Export
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          target: bin
          outputs: type=local,dest=./dist
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Metadata
        id: extract
        run: |
          if [ -f "./dist/atpd" ]; then
            echo "atpd-v1.0.0-${{ github.sha }}" > ./dist/runtime_version.txt
            SIZE=$(du -h ./dist/atpd | cut -f1)
            # 这里的输出供下一个 job 使用
            echo "v_output=v1.0.0" >> $GITHUB_OUTPUT
            echo "binary_size=$SIZE" >> $GITHUB_OUTPUT
            file ./dist/atpd
          else
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: atpd-build-${{ github.run_number }}
          path: ./dist/atpd

  update-status:
    name: Update Checkpoint
    needs: build-and-verify
    # 仅在 main 分支构建成功时更新看板
    if: success() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Update Project Issue
        uses: actions/github-script@v9
        env:
          V_OUTPUT: ${{ needs.build-and-verify.outputs.v_output }}
          SIZE: ${{ needs.build-and-verify.outputs.binary_size }}
          TARGET_ISSUE: 6
        with:
          script: |
            const { V_OUTPUT, SIZE, TARGET_ISSUE } = process.env;
            const now = new Date();
            // 转换为北京时间 (UTC+8)
            const localTime = new Date(now.getTime() + 8 * 3600 * 1000);
            const fmt = (v) => v.toString().padStart(2, '0');
            const ts = `${localTime.getFullYear().toString().slice(-2)}${fmt(localTime.getMonth()+1)}${fmt(localTime.getDate())} ${fmt(localTime.getHours())}:${fmt(localTime.getMinutes())}`;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            
            // 构造 Issue 内容行
            const newEntry = `🟢 **#${context.runNumber}** | \`${ts}\` | 📦 \`${SIZE}\` | [Artifact](${runUrl})`;
            
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(TARGET_ISSUE)
            });
            
            // 将新记录置于顶部
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(TARGET_ISSUE),
              body: newEntry + "\n" + (issue.body || "")
            });

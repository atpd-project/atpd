name: Build ATP for Android (musl)
run-name: "#${{ github.run_number }}: ${{ github.event.head_commit.message }}"

on:
  push:
    branches: [ '**' ]
    paths: [ 'src/**', 'include/**', 'scripts/**', 'Makefile', 'Dockerfile', '.github/workflows/build.yml' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Compile and Verify
    runs-on: ubuntu-latest
    outputs:
      v_output: ${{ steps.extract.outputs.v_output }}
      binary_size: ${{ steps.extract.outputs.binary_size }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Build and Export
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          target: bin
          outputs: type=local,dest=./dist
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Metadata
        id: extract
        run: |
          if [ -f "./dist/atpd" ]; then
            echo "atpd-v1.0.0-${{ github.sha }}" > ./dist/runtime_version.txt
            SIZE=$(du -h ./dist/atpd | cut -f1)
            echo "v_output=v1.0.0" >> $GITHUB_OUTPUT
            echo "binary_size=$SIZE" >> $GITHUB_OUTPUT
            file ./dist/atpd
          else
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: atpd-build-${{ github.run_number }}
          path: ./dist/atpd


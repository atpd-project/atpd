name: Build ATP for Android (musl)

on:
  push:
    branches: [dev, main]
    tags:
      - 'v*'
    paths:
      - 'src/**'
      - 'include/**'
      - 'scripts/**'
      - 'Makefile'
      - '.github/**'
      - '!**.md'
      - '!docs/**'
      - '!examples/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    
    if: |
      (!contains(github.event.head_commit.message, '[skip ci]')) &&
      (!contains(github.event.head_commit.message, '[skip actions]'))
    
    outputs:
      version: ${{ steps.build-atp.outputs.version }}
      build_date: ${{ steps.build_date.outputs.date }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup build environment
      id: setup
      uses: ./.github/actions/setup-musl-env

    - name: Build ATP
      id: build-atp
      uses: ./.github/actions/build-atp
      with:
        cc-path: ${{ steps.setup.outputs.cc-path }}
        ar-path: ${{ steps.setup.outputs.ar-path }}
        ranlib-path: ${{ steps.setup.outputs.ranlib-path }}
        strip-path: ${{ steps.setup.outputs.strip-path }}
        curl-include-path: ${{ steps.setup.outputs.curl-include-path }}
        curl-lib-path: ${{ steps.setup.outputs.curl-lib-path }}

    - name: Get build date
      id: build_date
      run: |
        echo "date=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT

    - name: Build summary
      if: success()
      run: |
        BINARY_SIZE=$(ls -lh ${{ steps.build-atp.outputs.binary-path }} | awk '{print $5}')
        echo "### ✅ Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| Version | ${{ steps.build-atp.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| Binary size | $BINARY_SIZE |" >> $GITHUB_STEP_SUMMARY
        echo "| Build date | ${{ steps.build_date.outputs.date }} |" >> $GITHUB_STEP_SUMMARY

    - name: Upload artifact (dev)
      uses: actions/upload-artifact@v4
      if: github.ref == 'refs/heads/dev'
      with:
        name: atpd-dev-${{ steps.build-atp.outputs.version }}
        path: ${{ steps.build-atp.outputs.binary-path }}

    - name: Upload artifact (main)
      uses: actions/upload-artifact@v4
      if: github.ref == 'refs/heads/main'
      with:
        name: atpd-${{ steps.build-atp.outputs.version }}
        path: ${{ steps.build-atp.outputs.binary-path }}

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && success()
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: atpd-${{ needs.build.outputs.version }}
        path: .

    - name: Create Release
      uses: ./.github/actions/create-release
      with:
        binary-path: atpd
        version: ${{ needs.build.outputs.version }}
        tag-name: ${{ github.ref_name }}
        build-date: ${{ needs.build.outputs.build_date }}
        commit-sha: ${{ github.sha }}
        prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}

  update-known-good:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/dev' && success()
    permissions:
      contents: read
      issues: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          source:
            - 'src/**'
            - 'include/**'
            - 'Makefile'
            - 'scripts/**'

    - name: Update Known Good Commits Issue
      if: steps.filter.outputs.source == 'true'
      run: |
        ISSUE_NUMBER=1
        COMMIT=$(git rev-parse --short HEAD)
        DATE=$(date +%Y-%m-%d)
        TITLE=$(git log -1 --format=%s | sed 's/|/\\|/g')
        NEW_ROW="| \`$COMMIT\` | $DATE | ✅ | $TITLE |"
        
        curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
             -H "Accept: application/vnd.github.v3+json" \
             "https://api.github.com/repos/${{ github.repository }}/issues/$ISSUE_NUMBER" \
             > issue.json
        
        BODY=$(jq -r '.body' issue.json)
        BODY=$(echo "$BODY" | sed "/^|--------/a $NEW_ROW")
        
        BODY=$(echo "$BODY" | awk '
          BEGIN { in_table = 0; count = 0; header = ""; rows = "" }
          /^# Known Good Commits/ { header = header $0 "\n"; next }
          /^This issue tracks/ { header = header $0 "\n"; next }
          /^---/ { header = header $0 "\n"; next }
          /^\|/ { 
            count++
            if (count <= 7) rows = rows $0 "\n"
            next
          }
          /^\*Last updated/ { 
            print header
            print rows
            print
            next
          }
          { print }
        ')
        
        TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
        BODY=$(echo "$BODY" | sed "s/\*Last updated:.*/\*Last updated: $TIMESTAMP\*/")
        BODY_ESCAPED=$(echo "$BODY" | jq -Rs '.')
        
        echo "{\"body\": $BODY_ESCAPED}" | \
        curl -s -X PATCH \
             -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
             -H "Accept: application/vnd.github.v3+json" \
             -H "Content-Type: application/json" \
             "https://api.github.com/repos/${{ github.repository }}/issues/$ISSUE_NUMBER" \
             -d @-

name: Build ATP for Android (musl)
run-name: "#${{ github.run_number }}: ${{ github.event.head_commit.message }}"

on:
  push:
    branches:
      - main
      - dev
      - feat-unified-reactor
    paths:
      - 'src/**'
      - 'include/**'
      - 'scripts/**'
      - 'Makefile'
      - 'Dockerfile'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Compile and Verify
    runs-on: ubuntu-latest
    outputs:
      binary_size: ${{ steps.extract.outputs.binary_size }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Build and Export
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          target: bin
          outputs: type=local,dest=./dist
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Metadata
        id: extract
        run: |
          if [ -f "./dist/atpd" ]; then
            SIZE=$(du -h ./dist/atpd | cut -f1)
            echo "binary_size=$SIZE" >> $GITHUB_OUTPUT
            file ./dist/atpd
          else
            echo "Error: Binary not found!"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: atpd-build-${{ github.run_number }}
          path: ./dist/atpd

  update-status:
    name: Update Checkpoint
    needs: build-and-verify
    if: success()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Update Project Issue
        uses: actions/github-script@v9
        env:
          SIZE: ${{ needs.build-and-verify.outputs.binary_size }}
          TARGET_ISSUE: 6
        with:
          script: |
            const { SIZE, TARGET_ISSUE } = process.env;
            const now = new Date();
            // 转换为北京时间 (UTC+8)
            const localTime = new Date(now.getTime() + 8 * 3600 * 1000);
            const fmt = (v) => v.toString().padStart(2, '0');
            const ts = `${localTime.getFullYear().toString().slice(-2)}${fmt(localTime.getMonth()+1)}${fmt(localTime.getDate())} ${fmt(localTime.getHours())}:${fmt(localTime.getMinutes())}`;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            
            // 最终效果：✅ [**#编号**](详情链接) | 时间 | 📦 大小 | [Artifact](详情链接)
            const newEntry = `✅ [**#${context.runNumber}**](${runUrl}) | \`${ts}\` | 📦 \`${SIZE}\` | [Artifact](${runUrl})`;
            
            try {
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parseInt(TARGET_ISSUE)
              });
              
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parseInt(TARGET_ISSUE),
                body: newEntry + "\n" + (issue.body || "")
              });
              console.log("Issue updated successfully.");
            } catch (error) {
              console.error("Failed to update issue:", error);
            }

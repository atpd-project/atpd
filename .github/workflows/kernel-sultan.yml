name: Build Sultan + xxKSU

run-name: "#${{ github.run_number }}: ${{ github.event.head_commit.message }}"

on:
  workflow_dispatch:

env:
  ANYKERNEL_REPO: https://github.com/TheWildJames/AnyKernel3.git
  PATCHES_REPO: https://github.com/yapixel/kernel_patches
  SCRIPTS_REPO: https://github.com/TheSillyOk/sh
  KSU_REPO: backslashxx/KernelSU
  KSU_BRANCH: master
  GCC_VERSION: "14.2.0"
  GCC_ARCHIVE_URL: "https://kernel.org/pub/tools/crosstool/files/bin/x86_64/14.2.0/x86_64-gcc-14.2.0-nolibc-aarch64-linux.tar.gz"
  TARGET_ISSUE: 14

jobs:
  check-upstream:
    name: Check Upstream Updates
    runs-on: ubuntu-latest
    outputs:
      sultan_updated: ${{ steps.check.outputs.sultan_updated }}
      ksu_updated: ${{ steps.check.outputs.ksu_updated }}
      kowsu_updated: ${{ steps.check.outputs.kowsu_updated }}
      sultan_latest: ${{ steps.check.outputs.sultan_latest }}
      ksu_latest: ${{ steps.check.outputs.ksu_latest }}
      kowsu_latest: ${{ steps.check.outputs.kowsu_latest }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v7
      
      - name: Check Sultan Latest Tag
        id: sultan
        run: |
          SULTAN_TAG=$(git ls-remote --tags https://github.com/kerneltoast/android_kernel_google_tensynos.git | \
            grep -o 'refs/tags/.*' | sed 's|refs/tags/||' | sort -V | tail -1)
          echo "latest=$SULTAN_TAG" >> $GITHUB_OUTPUT
          
      - name: Check xxKSU Latest Commit Time
        id: ksu
        run: |
          KSU_TIME=$(curl -s -H "Authorization: token ${{ github.token }}" \
            "https://api.github.com/repos/backslashxx/KernelSU/branches/master" | \
            jq -r '.commit.commit.committer.date')
          echo "latest=$KSU_TIME" >> $GITHUB_OUTPUT
          
      - name: Check KowSU Latest Version
        id: kowsu
        run: |
          KOWSU_VER=$(curl -s -H "User-Agent: Mozilla/5.0" "https://t.me/s/kowsu_build" | \
            grep -oE 'KowSU_v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-g[0-9a-f]+_[0-9]+-release\.apk' | \
            head -1 | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+')
          echo "latest=${KOWSU_VER:-unknown}" >> $GITHUB_OUTPUT
          
      - name: Get Last Build Info from Issue #14
        id: last_build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE_BODY=$(gh issue view ${{ env.TARGET_ISSUE }} --json body --jq '.body' 2>/dev/null || echo "")
          if [ -n "$ISSUE_BODY" ]; then
            LAST_SULTAN=$(echo "$ISSUE_BODY" | grep -oP '(?<=Sultan: `)[^`]+' | head -1)
            LAST_KSU=$(echo "$ISSUE_BODY" | grep -oP '(?<=xxKSU: `)[^`]+' | head -1)
            LAST_KOWSU=$(echo "$ISSUE_BODY" | grep -oP '(?<=KowSU: `)[^`]+' | head -1)
            echo "sultan=$LAST_SULTAN" >> $GITHUB_OUTPUT
            echo "ksu=$LAST_KSU" >> $GITHUB_OUTPUT
            echo "kowsu=$LAST_KOWSU" >> $GITHUB_OUTPUT
          else
            echo "sultan=" >> $GITHUB_OUTPUT
            echo "ksu=" >> $GITHUB_OUTPUT
            echo "kowsu=" >> $GITHUB_OUTPUT
          fi
          
      - name: Compare Versions
        id: check
        run: |
          SULTAN_NEW="${{ steps.sultan.outputs.latest }}"
          SULTAN_OLD="${{ steps.last_build.outputs.sultan }}"
          KSU_NEW="${{ steps.ksu.outputs.latest }}"
          KSU_OLD="${{ steps.last_build.outputs.ksu }}"
          KOWSU_NEW="${{ steps.kowsu.outputs.latest }}"
          KOWSU_OLD="${{ steps.last_build.outputs.kowsu }}"
          
          SULTAN_UPDATED="false"
          KSU_UPDATED="false"
          KOWSU_UPDATED="false"
          
          if [ -z "$SULTAN_OLD" ] || [ "$SULTAN_NEW" != "$SULTAN_OLD" ]; then
            SULTAN_UPDATED="true"
          fi
          
          if [ -n "$KSU_NEW" ] && [ "$KSU_NEW" != "$KSU_OLD" ]; then
            KSU_UPDATED="true"
          fi
          
          if [ -n "$KOWSU_NEW" ] && [ "$KOWSU_NEW" != "$KOWSU_OLD" ] && [ "$KOWSU_NEW" != "unknown" ]; then
            KOWSU_UPDATED="true"
          fi
          
          SHOULD_BUILD="false"
          if [ "$SULTAN_UPDATED" = "true" ] || [ "$KSU_UPDATED" = "true" ] || [ "$KOWSU_UPDATED" = "true" ]; then
            SHOULD_BUILD="true"
          fi
          
          echo "sultan_updated=$SULTAN_UPDATED" >> $GITHUB_OUTPUT
          echo "ksu_updated=$KSU_UPDATED" >> $GITHUB_OUTPUT
          echo "kowsu_updated=$KOWSU_UPDATED" >> $GITHUB_OUTPUT
          echo "sultan_latest=$SULTAN_NEW" >> $GITHUB_OUTPUT
          echo "ksu_latest=$KSU_NEW" >> $GITHUB_OUTPUT
          echo "kowsu_latest=$KOWSU_NEW" >> $GITHUB_OUTPUT
          echo "should_build=$SHOULD_BUILD" >> $GITHUB_OUTPUT
          
          echo "Sultan: $SULTAN_OLD -> $SULTAN_NEW (updated: $SULTAN_UPDATED)"
          echo "KSU: $KSU_OLD -> $KSU_NEW (updated: $KSU_UPDATED)"
          echo "KowSU: $KOWSU_OLD -> $KOWSU_NEW (updated: $KOWSU_UPDATED)"
          echo "Should build: $SHOULD_BUILD"

  build:
    name: Build ${{ matrix.device_label }} Kernel
    runs-on: ubuntu-latest
    needs: check-upstream
    if: |
      always() &&
      (needs.check-upstream.outputs.should_build == 'true' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
          - codename: zuma
            kernel_branch: 16.0.0-sultan
            kernel_repo: https://github.com/kerneltoast/android_kernel_google_tensynos
            anykernel_branch: sultan-zuma
            defconfig: zuma_defconfig
            dtb_path: google-devices/zuma/dts
            device_label: zuma
          - codename: gs201
            kernel_branch: 16.0.0-sultan
            kernel_repo: https://github.com/kerneltoast/android_kernel_google_tensynos
            anykernel_branch: sultan-gs201
            defconfig: gs201_defconfig
            dtb_path: google-devices/gs201/dts
            device_label: gs201
          - codename: zumapro
            kernel_branch: 16.0.0-sultan
            kernel_repo: https://github.com/kerneltoast/android_kernel_google_tensynos
            anykernel_branch: sultan-zumapro
            defconfig: zumapro_defconfig
            dtb_path: google-devices/zumapro/dts
            device_label: zumapro

    outputs:
      ksu_ver: ${{ steps.meta.outputs.ksu_ver }}
      s_tag: ${{ steps.meta.outputs.s_tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install GCC
        run: |
          curl -L "${{ env.GCC_ARCHIVE_URL }}" -o gcc.tar.gz
          tar -xf gcc.tar.gz
          echo "GCC_PATH=$PWD/gcc-${{ env.GCC_VERSION }}-nolibc/aarch64-linux/bin/aarch64-linux-" >> "$GITHUB_ENV"

      - name: Clone Source
        run: |
          git clone --depth=1 "${{ matrix.kernel_repo }}" -b "${{ matrix.kernel_branch }}" sultan
          git clone --depth=1 "${{ env.ANYKERNEL_REPO }}" -b "${{ matrix.anykernel_branch }}" AK3
          git clone --depth=1 "${{ env.PATCHES_REPO }}" kernel_patches
          git clone --depth=1 "${{ env.SCRIPTS_REPO }}" sh

      - name: Metadata
        id: meta
        run: |
          S_TAG=$(git -C sultan tag --sort=-committerdate | head -n1 || echo "latest")
          K_VER=$(./sh/get_ksuver.sh "backslashxx" "KernelSU" "${{ env.KSU_BRANCH }}" || echo "unknown")
          echo "ksu_ver=$K_VER" >> "$GITHUB_OUTPUT"
          echo "s_tag=$S_TAG" >> "$GITHUB_OUTPUT"

      - name: KSU & Patches
        working-directory: sultan
        run: |
          curl -LSs "https://raw.githubusercontent.com/${{ env.KSU_REPO }}/${{ env.KSU_BRANCH }}/kernel/setup.sh" | bash -s -- "${{ env.KSU_BRANCH }}"
          patch -p1 < ../kernel_patches/sultan/60_scripts_mkcompile_h.patch
          patch -p1 < ../kernel_patches/sultan/61_scripts_setlocalversion.patch
          patch -p1 < ../kernel_patches/sultan/62_init_Makefile.patch

      - name: Inject Configuration
        working-directory: sultan
        env:
          CROSS_COMPILE: ${{ env.GCC_PATH }}
          CC: ${{ env.GCC_PATH }}gcc
        run: |
          make O=out CROSS_COMPILE="$CROSS_COMPILE" CC="$CC" ${{ matrix.defconfig }}
          
          cat >> out/.config <<EOF
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_LOG_BUF_SHIFT=21
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_IP_NF_TARGET_TTL=y
          CONFIG_IP6_NF_TARGET_HL=y
          CONFIG_IP6_NF_MATCH_HL=y
          CONFIG_BPF_STREAM_PARSER=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_TARGET_TPROXY=y
          CONFIG_NETFILTER_XT_TARGET_REDIRECT=y
          CONFIG_NETFILTER_XT_MATCH_SOCKET=y
          CONFIG_NETFILTER_XT_MATCH_MARK=y
          CONFIG_NETFILTER_XT_MATCH_IPRANGE=y
          CONFIG_NETFILTER_XT_MATCH_OWNER=y
          CONFIG_NETFILTER_XT_MATCH_MAC=y
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
          CONFIG_NETFILTER_XT_MARK=y
          CONFIG_NETFILTER_XT_CONNMARK=y
          CONFIG_NETFILTER_XT_TARGET_CONNMARK=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP6_NF_TARGET_REDIRECT=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          CONFIG_IP_MULTIPLE_TABLES=y
          CONFIG_IPV6_MULTIPLE_TABLES=y
          CONFIG_XFRM_ALGO=y
          CONFIG_INET_IPCOMP=y
          CONFIG_INET_XFRM_TUNNEL=y
          CONFIG_INET_ESP=y
          CONFIG_XFRM_USER=y
          CONFIG_XFRM_SUB_POLICY=y
          CONFIG_INET_XFRM_MODE_TUNNEL=y
          CONFIG_XFRM_STATISTICS=y
          CONFIG_IP_SET=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_IP_SET_MAX=65534
          CONFIG_IP_SET_BITMAP_IP=y
          CONFIG_IP_SET_BITMAP_IPMAC=y
          CONFIG_IP_SET_BITMAP_PORT=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_IPMARK=y
          CONFIG_IP_SET_HASH_IPPORT=y
          CONFIG_IP_SET_HASH_IPPORTIP=y
          CONFIG_IP_SET_HASH_IPPORTNET=y
          CONFIG_IP_SET_HASH_IPMAC=y
          CONFIG_IP_SET_HASH_MAC=y
          CONFIG_IP_SET_HASH_NETPORTNET=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_IP_SET_HASH_NETNET=y
          CONFIG_IP_SET_HASH_NETPORT=y
          CONFIG_IP_SET_HASH_NETIFACE=y
          CONFIG_IP_SET_LIST_SET=y
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_DEFAULT_BBR=y
          CONFIG_KSU=y
          CONFIG_KSU_EXTRAS=y
          CONFIG_KSU_TAMPER_SYSCALL_TABLE=y
          CONFIG_KSU_LSM_SECURITY_HOOKS=y
          CONFIG_KSU_THRONE_TRACKER_ALWAYS_THREADED=y
          CONFIG_SECURITY_NETWORK=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_BPF=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_INOTIFY_USER=y
          EOF
          
          make O=out CROSS_COMPILE="$CROSS_COMPILE" CC="$CC" olddefconfig

      - name: Build Kernel
        working-directory: sultan
        env:
          KBUILD_BUILD_USER: build-user
          KBUILD_BUILD_HOST: build-host
          CROSS_COMPILE: ${{ env.GCC_PATH }}
          CC: ${{ env.GCC_PATH }}gcc
        run: |
          make O=out CROSS_COMPILE="$CROSS_COMPILE" CC="$CC" -j"$(nproc --all)"

      - name: Package
        run: |
          cp sultan/out/arch/arm64/boot/Image.lz4 AK3/Image.lz4
          cat sultan/out/${{ matrix.dtb_path }}/*.dtb > AK3/dtb
          ZIP_NAME="Sultan-${{ matrix.codename }}-$(date +'%Y%m%d')-xxKSU-r${{ steps.meta.outputs.ksu_ver }}.zip"
          ( cd AK3 && zip -r9 "../$ZIP_NAME" . -x "*.git*" )
          echo "ZIP_PATH=$PWD/$ZIP_NAME" >> "$GITHUB_ENV"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: Sultan-${{ matrix.codename }}
          path: ${{ env.ZIP_PATH }}

  release:
    name: Create Release
    needs: [check-upstream, build]
    if: |
      always() &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          
      - uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      - name: Get ATPd Version
        id: atpd
        run: |
          ATPD_SHA=$(curl -s -H "Authorization: token ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/commits/dev" | jq -r '.sha' | cut -c1-7)
          echo "sha=${ATPD_SHA:-unknown}" >> $GITHUB_OUTPUT

      - name: Tag and Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          KSU_VER: ${{ needs.build.outputs.ksu_ver }}
          S_TAG: ${{ needs.build.outputs.s_tag }}
          KOWSU_VER: ${{ needs.check-upstream.outputs.kowsu_latest }}
        run: |
          DATE=$(date +"%Y.%m.%d")
          MAX_REV=$(git tag -l "${DATE}-r*" | sed "s/${DATE}-r//" | sort -n | tail -n1)
          REV=$(( ${MAX_REV:-0} + 1 ))
          TAG="${DATE}-r${REV}"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag "$TAG"
          git push origin "$TAG"
          
          NOTES="### 🚀 Build Information
          | Component | Details |
          | :--- | :--- |
          | **Kernel Base** | Sultan (\`$S_TAG\`) |
          | **xxKSU** | \`r$KSU_VER\` |
          | **KowSU** | \`$KOWSU_VER\` |
          | **ATPd Compat** | \`${{ steps.atpd.outputs.sha }}\` |
          | **Compiler** | GCC 14.2.0 |
          
          ### 🛠️ atp4pixel Features
          - TPROXY / TTL / addrtype
          - Google VPN (XFRM) coexistence
          - IPSet Full Suite (64k)
          - TCP BBR + FQ
          - xxKSU Hookless / LSM
          - INOTIFY_USER"
          
          gh release create "$TAG" artifacts/**/*.zip \
            --title "Sultan Kernel — $TAG" \
            --notes "$NOTES"
          
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Update Issue #14
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          S_TAG: ${{ needs.build.outputs.s_tag }}
          KSU_VER: ${{ needs.build.outputs.ksu_ver }}
          KOWSU_VER: ${{ needs.check-upstream.outputs.kowsu_latest }}
          ATPD_SHA: ${{ steps.atpd.outputs.sha }}
          TARGET_ISSUE: 14
        run: |
          ./.github/scripts/update_kernel_issue.sh

      - name: Notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TAG: ${{ steps.release.outputs.tag }}
          S_TAG: ${{ needs.build.outputs.s_tag }}
          KSU_VER: ${{ needs.build.outputs.ksu_ver }}
          KOWSU_VER: ${{ needs.check-upstream.outputs.kowsu_latest }}
          ATPD_SHA: ${{ steps.atpd.outputs.sha }}
        run: |
          MESSAGE="🔧 *Sultan Kernel Build* ✅%0A"
          MESSAGE+="📱 Devices: zuma, gs201, zumapro%0A"
          MESSAGE+="🏷️ Sultan: \`${S_TAG}\`%0A"
          MESSAGE+="🔧 xxKSU: \`r${KSU_VER}\`%0A"
          MESSAGE+="📦 KowSU: \`${KOWSU_VER}\`%0A"
          MESSAGE+="🔗 ATPd: \`${ATPD_SHA}\`%0A"
          MESSAGE+="📥 [Download Release](https://github\.com/${{ github.repository }}/releases/tag/${TAG})"
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=MarkdownV2" \
            -d "disable_web_page_preview=true"

name: 'Setup Zig 0.16.0'
description: 'Install repository-pinned official Zig 0.16.0 with SHA-256 verification'

runs:
  using: "composite"
  steps:
    - name: Install Zig 0.16.0
      shell: bash
      run: |
        set -euo pipefail
        ZIG_VERSION="0.16.0"
        ARCH="$(uname -m)"
        if [ "$ARCH" = "x86_64" ]; then
          ZIG_URL="https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz"
          ZIG_SHA="70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
        elif [ "$ARCH" = "aarch64" ]; then
          ZIG_URL="https://ziglang.org/download/0.16.0/zig-aarch64-linux-0.16.0.tar.xz"
          ZIG_SHA="ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17"
        else
          echo "Unsupported architecture: $ARCH" >&2
          exit 1
        fi

        ZIG_DIR="/opt/zig-${ZIG_VERSION}"
        if [ ! -x "${ZIG_DIR}/zig" ] || [ "$("${ZIG_DIR}/zig" version 2>/dev/null || true)" != "${ZIG_VERSION}" ]; then
          echo "Downloading Zig ${ZIG_VERSION} for ${ARCH}..."
          curl -fsSL -o /tmp/zig.tar.xz "${ZIG_URL}"
          echo "${ZIG_SHA}  /tmp/zig.tar.xz" | sha256sum -c -
          sudo rm -rf "${ZIG_DIR}"
          sudo mkdir -p "${ZIG_DIR}"
          sudo tar -xJf /tmp/zig.tar.xz -C "${ZIG_DIR}" --strip-components=1
          rm -f /tmp/zig.tar.xz
        fi

        sudo ln -sf "${ZIG_DIR}/zig" /usr/local/bin/zig
        echo "${ZIG_DIR}" >> "$GITHUB_PATH"
        INSTALLED_VER="$("${ZIG_DIR}/zig" version)"
        echo "Zig version verified: ${INSTALLED_VER}"
        [ "${INSTALLED_VER}" = "${ZIG_VERSION}" ]

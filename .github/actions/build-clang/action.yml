name: Build ATPd with ZyCromerZ Clang 23
description: Build with ZyCromerZ Clang 23 cross-compiler and Musl libc, extract metadata, upload artifact

inputs:
  clang-url:
    description: 'URL of ZyCromerZ Clang release tarball'
    required: false
    default: 'https://github.com/ZyCromerZ/Clang/releases/download/23.0.0git-20260130-release/Clang-23.0.0git-20260130.tar.gz'
  build-type:
    description: 'debug or release'
    required: false
    default: 'release'
  artifact-suffix:
    description: 'Suffix for artifact name'
    required: false
    default: ''
  retention-days:
    description: 'Artifact retention days'
    required: false
    default: '7'

outputs:
  binary_size:
    description: 'Size of clang binary'
    value: ${{ steps.extract.outputs.binary_size }}
  atp_version:
    description: 'ATP_VERSION_STRING'
    value: ${{ steps.extract.outputs.atp_version }}
  runtime_ver:
    description: 'atpd -v output'
    value: ${{ steps.build.outputs.runtime_ver }}
  compiler_ver:
    description: 'Clang version'
    value: ${{ steps.build.outputs.compiler_ver }}

runs:
  using: "composite"
  steps:
    - name: Generate Version
      shell: bash
      run: |
        chmod +x scripts/gen_version.sh
        ./scripts/gen_version.sh
        cat include/version.h

    - name: Setup Dependencies
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq qemu-user-static curl tar xz-utils

    - name: Set up QEMU for Docker
      uses: docker/setup-qemu-action@v4

    - name: Extract Musl AArch64 Sysroot from Alpine
      shell: bash
      run: |
        sudo mkdir -p /opt/musl-aarch64
        echo "Extracting Musl AArch64 sysroot from official Alpine container..."
        docker run --rm --platform linux/arm64 -v /opt/musl-aarch64:/out alpine:3.21 sh -c "apk add --no-cache musl-dev linux-headers && cp -a /usr /lib /out/"
        sudo chmod -R 755 /opt/musl-aarch64

    - name: Cache ZyCromerZ Clang 23
      id: cache-clang
      uses: actions/cache@v6
      with:
        path: /opt/zyc-clang
        key: zyc-clang-23.0.0git-20260130-${{ runner.os }}

    - name: Download ZyCromerZ Clang 23
      if: steps.cache-clang.outputs.cache-hit != 'true'
      shell: bash
      run: |
        sudo mkdir -p /opt/zyc-clang
        echo "Downloading ZyCromerZ Clang 23 from ${{ inputs.clang-url }}..."
        curl -sSL --retry 3 "${{ inputs.clang-url }}" -o /tmp/zyc-clang.tar.gz
        sudo tar -xzf /tmp/zyc-clang.tar.gz -C /opt/zyc-clang
        rm -f /tmp/zyc-clang.tar.gz

    - name: Build with ZyCromerZ Clang 23 (Musl Target)
      id: build
      shell: bash
      run: |
        sudo chmod -R 755 /opt/zyc-clang
        CLANG_BIN=$(find /opt/zyc-clang -type f -name "clang" 2>/dev/null | head -1)
        STRIP_BIN=$(find /opt/zyc-clang -type f -name "llvm-strip" 2>/dev/null | head -1)
        
        if [ -z "$CLANG_BIN" ]; then
          CLANG_BIN="clang"
        else
          export PATH="$(dirname "$CLANG_BIN"):$PATH"
        fi
        
        if [ -z "$STRIP_BIN" ]; then
          STRIP_BIN="llvm-strip"
        fi

        echo "Using Clang Binary: $CLANG_BIN"
        $CLANG_BIN --version || true

        if [ "${{ inputs.build-type }}" = "debug" ]; then
          FLAGS="-O0 -g -DATP_DEBUG"
        else
          FLAGS="-Oz -flto -ffunction-sections -fdata-sections -fno-unwind-tables -fno-asynchronous-unwind-tables -fmerge-all-constants -fno-ident -DNDEBUG -DYYJSON_DISABLE_WRITER=1 -DYYJSON_DISABLE_FAST_FP_CONV=1 -DYYJSON_DISABLE_NON_STANDARD=1 -fstack-protector-strong -D_FORTIFY_SOURCE=3"
        fi

        SYSROOT_ARG=""
        if [ -d "/opt/musl-aarch64/usr" ]; then
          SYSROOT_ARG="--sysroot=/opt/musl-aarch64"
        elif [ -d "/opt/musl-aarch64/aarch64-linux-musl" ]; then
          SYSROOT_ARG="--sysroot=/opt/musl-aarch64/aarch64-linux-musl"
        fi

        echo "Compiling with ZyCromerZ Clang 23 (target=aarch64-linux-musl)..."
        $CLANG_BIN --target=aarch64-linux-musl $SYSROOT_ARG \
          -Wall -Wextra -D_GNU_SOURCE -Qunused-arguments \
          -Iinclude \
          $FLAGS \
          -static \
          -Wl,--gc-sections -Wl,--strip-all -Wl,--build-id=none \
          -o ./atpd-clang \
          $(find src -name "*.c" ! -name "epoll.c") \
          -lpthread

        if command -v "$STRIP_BIN" >/dev/null 2>&1 || [ -f "$STRIP_BIN" ]; then
          $STRIP_BIN --strip-all --strip-unneeded \
            --remove-section=.comment \
            --remove-section=.note* \
            --remove-section=.ARM.exidx* \
            --remove-section=.eh_frame* \
            ./atpd-clang 2>/dev/null || true
        fi

        RUNTIME_VER=$(qemu-aarch64-static ./atpd-clang -v 2>/dev/null | head -1 || echo "N/A")
        echo "runtime_ver=$RUNTIME_VER" >> $GITHUB_OUTPUT
        COMPILER_VER=$($CLANG_BIN --version 2>/dev/null | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || echo "23.0.0")
        echo "compiler_ver=$COMPILER_VER" >> $GITHUB_OUTPUT

    - name: Verify Binary
      shell: bash
      run: |
        if [ ! -s "./atpd-clang" ]; then
          echo "::error::Binary not found or is empty"
          exit 1
        fi
        file ./atpd-clang
        ls -lh ./atpd-clang

    - name: Extract Metadata
      id: extract
      shell: bash
      run: |
        SIZE=$(du -h ./atpd-clang | cut -f1)
        echo "binary_size=$SIZE" >> $GITHUB_OUTPUT
        VER=$(grep -oP 'ATP_VERSION_STRING\s+"\K[^"]+' include/version.h || echo "v0")
        echo "atp_version=$VER" >> $GITHUB_OUTPUT

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: atpd-clang${{ inputs.artifact-suffix }}
        path: ./atpd-clang
        retention-days: ${{ inputs.retention-days }}

name: Build ATPd with pinned Zig
description: Build the Docker release artifact with the repository-pinned Zig CC toolchain

inputs:
  artifact-suffix:
    description: 'Suffix for artifact name'
    required: false
    default: ''
  retention-days:
    description: 'Artifact retention days'
    required: false
    default: '7'

outputs:
  atp_version:
    description: 'ATPd product version'
    value: ${{ steps.zig-extract.outputs.atp_version }}
  zig_binary_size:
    description: 'Size of zig binary'
    value: ${{ steps.zig-extract.outputs.zig_binary_size }}
  zig_compiler_ver:
    description: 'Zig compiler version'
    value: ${{ steps.zig-extract.outputs.zig_compiler_ver }}
  atpd_version_string:
    description: 'atpd -v output'
    value: ${{ steps.zig-extract.outputs.atpd_version_string }}

runs:
  using: "composite"
  steps:
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build with Zig CC
      id: build
      shell: bash
      run: |
        set -euo pipefail
        docker buildx build --platform linux/arm64 \
          --target builder -t atpd-zig-builder --load .
        container_id=$(docker create --platform linux/arm64 atpd-zig-builder)
        docker cp "$container_id:/app/build/bin/atpd" ./atpd-zig
        docker rm -v "$container_id"
        echo "runtime_ver=$(docker run --rm --platform linux/arm64 --entrypoint /app/build/bin/atpd atpd-zig-builder -v | head -1)" >> "$GITHUB_OUTPUT"
        echo "zig_compiler_ver=$(docker run --rm --platform linux/arm64 --entrypoint zig atpd-zig-builder version)" >> "$GITHUB_OUTPUT"

    - name: Verify Binary
      shell: bash
      run: |
        if [ ! -s "./atpd-zig" ]; then
          echo "::error::Zig binary not found or is empty"
          exit 1
        fi
        file ./atpd-zig
        ls -lh ./atpd-zig

    - name: Extract Metadata
      id: zig-extract
      shell: bash
      run: |
        ZIG_SIZE=$(du -h ./atpd-zig | cut -f1)
        echo "atp_version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
        echo "zig_binary_size=$ZIG_SIZE" >> "$GITHUB_OUTPUT"
        echo "zig_compiler_ver=${{ steps.build.outputs.zig_compiler_ver }}" >> "$GITHUB_OUTPUT"
        echo "atpd_version_string=${{ steps.build.outputs.runtime_ver }}" >> "$GITHUB_OUTPUT"

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: atpd-zig${{ inputs.artifact-suffix }}
        path: ./atpd-zig
        retention-days: ${{ inputs.retention-days }}

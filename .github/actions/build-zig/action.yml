name: Build ATPd with Zig
description: Build with Zig CC, extract metadata, upload artifact (requires prior checkout)

inputs:
  zig-version:
    description: 'Zig version'
    required: false
    default: 'master'
  artifact-suffix:
    description: 'Suffix for artifact name'
    required: false
    default: ''
  retention-days:
    description: 'Artifact retention days'
    required: false
    default: '7'

outputs:
  zig_binary_size:
    description: 'Size of zig binary'
    value: ${{ steps.zig-extract.outputs.zig_binary_size }}
  zig_compiler_ver:
    description: 'Zig compiler version'
    value: ${{ steps.zig-extract.outputs.zig_compiler_ver }}
  atpd_version_string:
    description: 'atpd -v output'
    value: ${{ steps.zig-extract.outputs.atpd_version_string }}

runs:
  using: "composite"
  steps:
    - name: Generate Version
      shell: bash
      run: |
        chmod +x scripts/gen_version.sh
        ./scripts/gen_version.sh
        cat include/version.h

    - name: Setup Zig
      uses: mlugg/setup-zig@v2
      with:
        version: ${{ inputs.zig-version }}

    - name: Cache Zig
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/zig
          .zig-cache
        key: zig-${{ runner.os }}-${{ inputs.zig-version }}-${{ hashFiles('.github/actions/build-zig/action.yml') }}
        restore-keys: |
          zig-${{ runner.os }}-${{ inputs.zig-version }}-

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
    - name: Build with Zig CC
      shell: bash
      run: |
        zig cc -target aarch64-linux \
          -s -Oz -flto -ffunction-sections -fdata-sections -static \
          -Iinclude \
          -D_GNU_SOURCE \
          -DATP_DEFAULT_DIR="/data/adb/atp" \
          -o atpd-zig \
          $(find src -name "*.c" ! -path "src/cjson/*" ! -path "src/yyjson/*" ! -name "epoll.c") \
          src/yyjson/yyjson.c \
          -Wl,--gc-sections -Wl,--strip-all

    - name: Install QEMU
      shell: bash
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static
    - name: Verify Binary
      shell: bash
      run: |
        if [ ! -s "./atpd-zig" ]; then
          echo "::error::Zig binary not found or is empty"
          exit 1
        fi
        file ./atpd-zig
        ls -lh ./atpd-zig

    - name: Extract Metadata
      id: zig-extract
      shell: bash
      run: |
        ZIG_SIZE=$(du -h ./atpd-zig | cut -f1)
        echo "zig_binary_size=$ZIG_SIZE" >> $GITHUB_OUTPUT
        ZIG_VER=$(zig version 2>/dev/null || echo "0.11.0")
        echo "zig_compiler_ver=$ZIG_VER" >> $GITHUB_OUTPUT
        ATPD_VER=$(qemu-aarch64-static ./atpd-zig -v 2>/dev/null | head -1 || echo "N/A")
        echo "atpd_version_string=$ATPD_VER" >> $GITHUB_OUTPUT

    - name: Upload Artifact
      uses: actions/upload-artifact@v5
      with:
        name: atpd-zig${{ inputs.artifact-suffix }}
        path: ./atpd-zig
        retention-days: ${{ inputs.retention-days }}

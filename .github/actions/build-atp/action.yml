name: Build ATP binary
description: Compiles ATP daemon with musl

inputs:
  cc-path:
    description: 'Path to musl-gcc'
    required: true
  ar-path:
    description: 'Path to musl-ar'
    required: true
  ranlib-path:
    description: 'Path to musl-ranlib'
    required: true
  strip-path:
    description: 'Path to musl-strip'
    required: true
  libev-include-path:
    description: 'Path to libev include dir'
    required: true
  libev-lib-path:
    description: 'Path to libev lib dir'
    required: true

outputs:
  version:
    description: 'ATP version'
    value: ${{ steps.build.outputs.version }}
  binary-path:
    description: 'Path to compiled binary'
    value: ${{ steps.build.outputs.binary }}

runs:
  using: composite
  steps:
    - name: Build ATP
      id: build
      shell: bash
      run: |
        export CC="${{ inputs.cc-path }}"
        export AR="${{ inputs.ar-path }}"
        export RANLIB="${{ inputs.ranlib-path }}"
        export STRIP="${{ inputs.strip-path }}"
        
        LIBEV_INCLUDE="${{ inputs.libev-include-path }}"
        LIBEV_LIB="${{ inputs.libev-lib-path }}"
        
        echo "=== Build Environment ==="
        echo "CC: $CC"
        echo "LIBEV_INCLUDE: $LIBEV_INCLUDE"
        echo "LIBEV_LIB: $LIBEV_LIB"
        echo "=========================="
        
        chmod +x scripts/gen_version.sh
        ./scripts/gen_version.sh
        cat include/version.h
        
        make clean
        make -j$(nproc) \
          EXTRA_CFLAGS="-I$LIBEV_INCLUDE" \
          EXTRA_LDFLAGS="-L$LIBEV_LIB -lev -pthread -static"
        
        file build/bin/atpd
        ls -la build/bin/atpd
        
        echo "binary=build/bin/atpd" >> $GITHUB_OUTPUT

    - name: Extract version
      id: version
      shell: bash
      run: |
        VERSION=$(grep ATP_VERSION_STRING include/version.h | cut -d'"' -f2)
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "ATP version: ${VERSION}"

    - name: Strip binary
      shell: bash
      run: |
        ${{ inputs.strip-path }} build/bin/atpd
        echo "Stripped binary size:"
        ls -la build/bin/atpd

name: Generate Version
description: Generate the deterministic version_build.h from VERSION and Git metadata

outputs:
  version_string:
    description: 'ATP_VERSION_STRING value'
    value: ${{ steps.read-version.outputs.version }}

runs:
  using: "composite"
  steps:
    - name: Generate Version
      shell: bash
      run: |
        ./scripts/gen_version.sh build/generated/version_build.h
        cat build/generated/version_build.h

    - name: Read Version
      id: read-version
      shell: bash
      run: |
        VER=$(sed -n '1p' VERSION)
        echo "version=$VER" >> $GITHUB_OUTPUT

name: Generate Version
description: Checkout code and generate version.h from git tags

inputs:
  fetch-depth:
    description: 'git fetch depth'
    required: false
    default: '0'

outputs:
  version_string:
    description: 'ATP_VERSION_STRING value'
    value: ${{ steps.read-version.outputs.version }}

runs:
  using: "composite"
  steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: ${{ inputs.fetch-depth }}

    - name: Generate Version
      shell: bash
      run: |
        chmod +x scripts/gen_version.sh
        ./scripts/gen_version.sh
        cat include/version.h

    - name: Read Version
      id: read-version
      shell: bash
      run: |
        VER=$(grep -oP 'ATP_VERSION_STRING\s+"\K[^"]+' include/version.h || echo "v0")
        echo "version=$VER" >> $GITHUB_OUTPUT

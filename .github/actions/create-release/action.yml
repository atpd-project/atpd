name: Create GitHub Release
description: Creates a GitHub Release with the built binary

inputs:
  binary-path:
    description: 'Path to the binary to upload'
    required: true
  version:
    description: 'Version string'
    required: true
  tag-name:
    description: 'Git tag name'
    required: true
  build-date:
    description: 'Build date string'
    required: true
  prerelease:
    description: 'Is this a prerelease?'
    required: false
    default: 'false'
  commit-sha:
    description: 'Commit SHA'
    required: false
    default: ${{ github.sha }}

runs:
  using: composite
  steps:
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ inputs.binary-path }}
        name: "ATP ${{ inputs.version }}"
        tag_name: ${{ inputs.tag-name }}
        body: |
          ## ATP ${{ inputs.version }}
          
          ### Build Information
          - **Version:** ${{ inputs.version }}
          - **Commit:** ${{ inputs.commit-sha }}
          - **Tag:** ${{ inputs.tag-name }}
          - **Build Date:** ${{ inputs.build-date }}
          
          ### Features
          - sing-box native eBPF inbound supervision
          - Google VPN XFRM/ipsec detection and Clash mode switching
          - Separate TUN/WireGuard/WARP VPN reporting
          - Direct mode on a configured Wi-Fi SSID with mode restoration
          - IPv4/IPv6 hotspot policy reconciliation
          - Runtime state machines, health checks, and traffic status
          
          ### Installation
          ```bash
          # Download and install
          wget -O /data/adb/atp/bin/atpd "https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag-name }}/atpd"
          chmod 755 /data/adb/atp/bin/atpd
          
          # Start ATP
          /data/adb/atp/bin/atpd start
          
          # Check status
          /data/adb/atp/bin/atpd status
          ```
        generate_release_notes: true
        draft: false
        prerelease: ${{ inputs.prerelease }}

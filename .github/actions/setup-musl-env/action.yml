name: Setup musl build environment
description: Installs musl toolchain and builds libev

outputs:
  cc-path:
    description: 'Path to musl-gcc'
    value: ${{ steps.setup.outputs.cc }}
  ar-path:
    description: 'Path to musl-ar'
    value: ${{ steps.setup.outputs.ar }}
  ranlib-path:
    description: 'Path to musl-ranlib'
    value: ${{ steps.setup.outputs.ranlib }}
  strip-path:
    description: 'Path to musl-strip'
    value: ${{ steps.setup.outputs.strip }}
  libev-include-path:
    description: 'Path to libev include dir'
    value: /tmp/libev-musl/include
  libev-lib-path:
    description: 'Path to libev lib dir'
    value: /tmp/libev-musl/lib

runs:
  using: composite
  steps:
    - name: Load version configuration
      shell: bash
      run: |
        source .github/env/versions.conf
        echo "MUSL_TOOLCHAIN_URL=$MUSL_TOOLCHAIN_URL" >> $GITHUB_ENV
        echo "MUSL_TOOLCHAIN_TRIPLET=$MUSL_TOOLCHAIN_TRIPLET" >> $GITHUB_ENV
        echo "LIBEV_VERSION=$LIBEV_VERSION" >> $GITHUB_ENV
        echo "LIBEV_DOWNLOAD_URL=$LIBEV_DOWNLOAD_URL" >> $GITHUB_ENV
        echo "LIBEV_INSTALL_DIR=/tmp/libev-musl" >> $GITHUB_ENV
        echo "LIBEV_BUILD_DIR=/tmp/libev-build" >> $GITHUB_ENV

    - name: Setup musl toolchain
      id: setup
      shell: bash
      run: |
        wget -q "$MUSL_TOOLCHAIN_URL" -O toolchain.tar.xz
        tar -xJf toolchain.tar.xz
        TOOLCHAIN_BIN=$(find "$PWD" -maxdepth 3 -name "$MUSL_TOOLCHAIN_TRIPLET-gcc" | head -1 | xargs -I{} dirname {})
        if [ -z "$TOOLCHAIN_BIN" ]; then
          echo "ERROR: could not find $MUSL_TOOLCHAIN_TRIPLET-gcc"
          exit 1
        fi
        echo "$TOOLCHAIN_BIN" >> $GITHUB_PATH
        echo "cc=$TOOLCHAIN_BIN/$MUSL_TOOLCHAIN_TRIPLET-gcc" >> $GITHUB_OUTPUT
        echo "ar=$TOOLCHAIN_BIN/$MUSL_TOOLCHAIN_TRIPLET-ar" >> $GITHUB_OUTPUT
        echo "ranlib=$TOOLCHAIN_BIN/$MUSL_TOOLCHAIN_TRIPLET-ranlib" >> $GITHUB_OUTPUT
        echo "strip=$TOOLCHAIN_BIN/$MUSL_TOOLCHAIN_TRIPLET-strip" >> $GITHUB_OUTPUT

    - name: Cache libev
      id: cache-libev
      uses: actions/cache@v4
      with:
        path: ${{ env.LIBEV_INSTALL_DIR }}
        key: libev-musl-${{ env.LIBEV_VERSION }}

    - name: Build libev
      if: steps.cache-libev.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p "$LIBEV_BUILD_DIR" && cd "$LIBEV_BUILD_DIR"
        curl -L "$LIBEV_DOWNLOAD_URL" -o libev.tar.gz
        tar -xzf libev.tar.gz --strip-components=1
        ./configure \
          --host="$MUSL_TOOLCHAIN_TRIPLET" \
          --prefix="$LIBEV_INSTALL_DIR" \
          --disable-shared \
          --enable-static
        make -j$(nproc) && make install
        rm -rf "$LIBEV_BUILD_DIR"

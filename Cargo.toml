[package]
name = "atpd"
version = "1.0.1-alpha.1"
edition = "2021"

[dependencies]
serde_json = "1"
libc = "0.2"
rustix = { version = "1.1.6", default-features = false, features = ["event", "fs", "net", "pipe", "process", "stdio", "std", "termios", "time"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = true
